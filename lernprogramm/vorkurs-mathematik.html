     <tr><th>$\cos(x)$</th><td>$1$</td><td>$\frac{1}{2}\sqrt{3}$</td><td>$\frac{1}{2}\sqrt{2}$</td><td>$\frac{1}{2}$</td><td>$0$</td></tr>
     <tr><th>$\tan(x)$</th><td>$0$</td><td>$\frac{1}{\sqrt{3}}$</td><td>$1$</td><td>$\sqrt{3}$</td><td>—</td></tr>
     </table></div>
     <p>Ein Merktrick für die Sinuszeile: Schreiben Sie $\frac{1}{2}\sqrt{0}$, $\frac{1}{2}\sqrt{1}$, $\frac{1}{2}\sqrt{2}$, $\frac{1}{2}\sqrt{3}$, $\frac{1}{2}\sqrt{4}$ — das ergibt genau $0, \frac{1}{2}, \frac{1}{2}\sqrt{2}, \frac{1}{2}\sqrt{3}, 1$. Die Kosinuszeile ist dieselbe Folge rückwärts.</p>
     <p>Bei $90°$ ist der Tangens nicht definiert, weil dort $\cos(90°) = 0$ ist und er durch null teilen würde.</p>` }
   ],
   quiz:[
   { type:"mc", q:r`Welche Koordinaten hat der Punkt auf dem Einheitskreis zum Winkel $\alpha$?`,
     options:[ r`$(\sin(\alpha), \cos(\alpha))$`, r`$(\cos(\alpha), \sin(\alpha))$`, r`$(\tan(\alpha), 1)$`, r`$(1, \alpha)$` ],
     a:1, why:r`Der Kosinus ist die waagerechte, der Sinus die senkrechte Komponente — also $(\cos(\alpha), \sin(\alpha))$.` },

   { type:"mc", q:r`Wie groß ist $60°$ im Bogenmaß?`,
     options:[ r`$\frac{\pi}{6}$`, r`$\frac{\pi}{4}$`, r`$\frac{\pi}{3}$`, r`$\frac{\pi}{2}$` ],
     a:2, why:r`$\frac{\alpha}{180°} = \frac{x}{\pi}$ mit $\alpha = 60°$ liefert $x = \frac{60 \cdot \pi}{180} = \frac{\pi}{3}$.` },

   { type:"input", q:r`Rechnen Sie $\frac{3\pi}{4}$ ins Gradmaß um. (Antwort in Grad, nur die Zahl)`,
     a:["135"], why:r`$\alpha = \frac{x \cdot 180°}{\pi} = \frac{3\pi}{4} \cdot \frac{180°}{\pi} = 3 \cdot 45° = 135°$.`, fmt:"Zahl in Grad" },

   { type:"mc", q:r`Welcher Wert gehört zu $\cos(45°)$?`,
     options:[ r`$\frac{1}{2}$`, r`$\frac{1}{2}\sqrt{2}$`, r`$\frac{1}{2}\sqrt{3}$`, r`$1$` ],
     a:1, why:r`Bei $45°$ sind Sinus und Kosinus gleich: $\frac{1}{\sqrt{2}} = \frac{\sqrt{2}}{2} = \frac{1}{2}\sqrt{2} \approx 0{,}707$.` },

   { type:"input", q:r`Wie groß ist $\sin(90°)$?`,
     a:["1"], why:r`Bei $90°$ steht der Punkt auf dem Einheitskreis genau oben, bei $(0, 1)$. Die y-Koordinate ist der Sinus, also 1 — und $\cos(90°) = 0$.`, fmt:"Zahl" },

   { type:"mc", q:r`Warum ist $\tan(90°)$ nicht definiert?`,
     options:[ r`Weil $\sin(90°) = 0$ ist.`, r`Weil $\cos(90°) = 0$ ist und der Tangens durch den Kosinus teilt.`, r`Weil $90°$ kein spitzer Winkel ist.`, r`Weil das Bogenmaß dort $\pi$ wäre.` ],
     a:1, why:r`$\tan(x) = \frac{\sin(x)}{\cos(x)}$, und bei $90°$ ist der Nenner null. Im Dreieck entspricht das einer Ankathete der Länge null.` },

   { type:"mc", q:r`In welchem Bereich liegen die Werte von $\sin(x)$ für beliebige Winkel?`,
     options:[ r`$[0, 1]$`, r`$[-1, 1]$`, r`$(-\infty, \infty)$`, r`$[0, \infty)$` ],
     a:1, why:r`Der Sinus ist die y-Koordinate eines Punktes auf dem Kreis mit Radius 1 — sie kann also nie größer als 1 oder kleiner als $-1$ werden. (Der Tangens dagegen ist unbeschränkt.)` },

   { type:"mc", q:r`In welchem Quadranten ist der Kosinus negativ und der Sinus positiv?`,
     options:[ r`Erster Quadrant (0° bis 90°)`, r`Zweiter Quadrant (90° bis 180°)`, r`Dritter Quadrant (180° bis 270°)`, r`Vierter Quadrant (270° bis 360°)` ],
     a:1, why:r`Im zweiten Quadranten liegt der Punkt links oben: negative x-Koordinate (Kosinus), positive y-Koordinate (Sinus).` }
   ]
 }
 ]
},
{
 n:"4", title:"Gleichungen und Ungleichungen", lessons:[

 /* ---------------------------------------------------------- 4.1 a */
 { id:"4.1", title:"Lineare und quadratische Gleichungen",
   lead:"Definitionsbereich und Lösungsmenge, gefährliche Umformungen, p-q-Formel und Satz vom Nullprodukt.",
   steps:[
   { h:"Definitionsbereich und Lösungsmenge",
     html: r`<p>Eine Gleichung besteht aus zwei Termen, verknüpft durch das Gleichheitszeichen. Enthält sie Variablen, ist sie eine Aussageform: $x + 3 = 5$ ist für $x = 2$ wahr und sonst falsch. Unser Ziel ist es, alle solchen Werte zu finden.</p>
     <div class="note def"><span class="nh">Definitionen</span>
     Der <b>Definitionsbereich</b> $D$ einer Gleichung sind alle reellen Zahlen, für die sowohl die linke als auch die rechte Seite definiert sind.<br><br>
     Die <b>Lösungsmenge</b> $L$ sind alle Zahlen aus $D$, die die Gleichung lösen: $L = \{x \in D; x \text{ löst die Gleichung}\}$.</div>
     <p>Zwei Gleichungen heißen <b>äquivalent</b>, wenn sie dieselbe Lösungsmenge besitzen. Die Strategie beim Lösen lautet deshalb: durch Äquivalenzumformungen so umformen, dass die Lösungsmenge klar ablesbar wird.</p>` },

   { h:"Umformungen, die die Lösungsmenge verändern",
     html: r`<p>Nicht jede Termumformung ist eine Äquivalenzumformung. Zwei typische Fälle:</p>
     <p><b>Kürzen</b> — hier vergrößert sich der Definitionsbereich:</p>`
     + D(r`\frac{x^2(x-1)}{x} = 0 \Rightarrow x(x-1) = 0`)
     + r`<p>Links ist nur $x = 1$ Lösung (für $x = 0$ wäre der Nenner null). Rechts kommt $x = 0$ als Lösung hinzu.</p>
     <p><b>Quadrieren</b> — hier kommen ebenfalls Lösungen hinzu:</p>`
     + D(r`x = 2 \Rightarrow x^2 = 4`)
     + r`<p>Links nur $x = 2$, rechts zusätzlich $x = -2$.</p>
     <div class="note warn"><span class="nh">Die Konsequenz</span>
     Zwischen solchen Zeilen steht nur ein <b>Folgerungspfeil</b>. Beide Umformungen sind erlaubt und oft sogar nötig — aber danach ist eine <b>Probe zwingend</b>: Jeder Lösungskandidat muss in die <b>ursprüngliche</b> Gleichung eingesetzt und überprüft werden.</div>` },

   { h:"Lineare Gleichungen",
     html: r`<div class="note def"><span class="nh">Definition</span>
     Eine <b>lineare Gleichung</b> ist von der Form $ax + b = 0$ mit $a, b \in \R$ und $a \ne 0$.</div>
     <p>Auch Gleichungen, die erst nach Äquivalenzumformungen diese Gestalt haben, nennen wir linear. Eine solche Gleichung hat immer <b>genau eine</b> Lösung:</p>`
     + D(r`ax + b = 0 \quad | -b`,
         r`\Leftrightarrow ax = -b \quad | : a`,
         r`\Leftrightarrow x = -\frac{b}{a}, \qquad \text{also } L = \{-\frac{b}{a}\}`)
     + r`<p>Beispiel $3x - 18 = -2x + 7$: mit $|+2x$ wird daraus $5x - 18 = 7$, mit $|+18$ dann $5x = 25$, mit $|:5$ schließlich $x = 5$. Also $L = \{5\}$.</p>` },

   { h:"Quadratische Gleichungen und die p-q-Formel",
     html: r`<p>Eine <b>quadratische Gleichung</b> hat die Form $a x^2 + bx + c = 0$ mit $a \ne 0$. Teilen wir durch $a$ und setzen $p = \frac{b}{a}$, $q = \frac{c}{a}$, erhalten wir die <b>Normalform</b> $x^2 + px + q = 0$.</p>
     <p>Die Lösung entsteht durch quadratische Ergänzung:</p>`
     + D(r`x^2 + px + (\frac{p}{2})^2 - (\frac{p}{2})^2 + q = 0`,
         r`\Leftrightarrow (x + \frac{p}{2})^2 = (\frac{p}{2})^2 - q`,
         r`\Leftrightarrow x + \frac{p}{2} = \pm\sqrt{(\frac{p}{2})^2 - q}`)
     + r`<div class="note def"><span class="nh">p-q-Formel</span>
     Die Gleichung $x^2 + px + q = 0$ hat die Lösungen</div>`
     + D(r`x_{1,2} = -\frac{p}{2} \pm \sqrt{(\frac{p}{2})^2 - q}`)
     + r`<p>Der Ausdruck unter der Wurzel — die <b>Diskriminante</b> — entscheidet über die Anzahl der Lösungen:</p>
     <ul>
       <li>$(\frac{p}{2})^2 - q < 0$: keine reelle Lösung, $L = \emptyset$</li>
       <li>$(\frac{p}{2})^2 - q = 0$: genau eine Lösung</li>
       <li>$(\frac{p}{2})^2 - q > 0$: genau zwei Lösungen</li>
     </ul>
     <p>Beispiel: $x^2 + 6x + 5 = 0$ liefert $x_{1,2} = -3 \pm \sqrt{9 - 5} = -3 \pm 2$, also $L = \{-5, -1\}$.</p>` },

   { h:"Satz vom Nullprodukt",
     html: r`<p>Liegt die linke Seite bereits als Produkt von Linearfaktoren vor, wäre Ausmultiplizieren plus p-q-Formel zwar richtig, aber unnötig umständlich.</p>
     <div class="note def"><span class="nh">Satz vom Nullprodukt</span>
     Ein Produkt zweier Ausdrücke ist genau dann 0, wenn einer oder beide Faktoren 0 sind:</div>`
     + D(r`x \cdot y = 0 \Leftrightarrow x = 0 \text{ oder } y = 0`)
     + r`<p>Bei $(x - 1)(x - 2) = 0$ liest man die Lösungen also direkt ab: $x_1 = 1$ und $x_2 = 2$.</p>
     <p>Derselbe Gedanke hilft, wenn sich $x$ ausklammern lässt: Aus $x^2 - 3x = 0$ wird $x(x - 3) = 0$, also $x_1 = 0$ und $x_2 = 3$ — ganz ohne p-q-Formel. Ein Fehler wäre es, hier durch $x$ zu <b>teilen</b>: dann ginge die Lösung $x = 0$ verloren.</p>` }
   ],
   quiz:[
   { type:"input", q:r`Lösen Sie: $7x + 4 = 2x - 11$. Geben Sie $x$ an.`,
     a:["-3"], why:r`$| -2x$ ergibt $5x + 4 = -11$, dann $| -4$ ergibt $5x = -15$, dann $| :5$ ergibt $x = -3$.`, fmt:"Zahl" },

   { type:"mc", q:r`Warum ist nach dem Quadrieren einer Gleichung eine Probe zwingend?`,
     options:[ r`Weil Quadrieren die Lösungsmenge verkleinern kann.`, r`Weil Quadrieren keine Äquivalenzumformung ist und Lösungen hinzukommen können.`, r`Weil sich der Definitionsbereich verkleinert.`, r`Weil die p-q-Formel sonst nicht gilt.` ],
     a:1, why:r`Aus $x = 2$ folgt $x^2 = 4$, aber $x^2 = 4$ hat zusätzlich die Lösung $x = -2$. Solche Scheinlösungen entlarvt nur die Probe in der <b>ursprünglichen</b> Gleichung.` },

   { type:"mc", q:r`Wie viele Lösungen hat $x^2 + 2x + 4 = 0$?`,
     options:[ r`Keine reelle Lösung`, r`Genau eine`, r`Genau zwei`, r`Unendlich viele` ],
     a:0, why:r`p-q-Formel mit $p = 2$, $q = 4$: unter der Wurzel steht $1 - 4 = -3 < 0$. Die Diskriminante ist negativ, also $L = \emptyset$.` },

   { type:"mc", q:r`Wie lautet die Lösungsmenge von $x^2 - 4x + 4 = 0$?`,
     options:[ r`$L = \{2, -2\}$`, r`$L = \{2\}$`, r`$L = \{4\}$`, r`$L = \emptyset$` ],
     a:1, why:r`$x_{1,2} = 2 \pm \sqrt{4 - 4} = 2 \pm 0$. Die Diskriminante ist null, es gibt genau eine Lösung. (Es ist auch die binomische Formel $(x-2)^2 = 0$.)` },

   { type:"ms", q:r`Lösen Sie $x^2 + x - 6 = 0$. Welche Werte gehören zur Lösungsmenge? (mehrere Antworten)`,
     options:[ r`$x = 2$`, r`$x = -3$`, r`$x = 3$`, r`$x = -2$` ],
     a:[0,1], why:r`p-q-Formel mit $p = 1$, $q = -6$: $x_{1,2} = -\frac{1}{2} \pm \sqrt{\frac{1}{4} + 6} = -\frac{1}{2} \pm \frac{5}{2}$, also $x_1 = 2$ und $x_2 = -3$.` },

   { type:"mc", q:r`Was sind die Lösungen von $(x + 4)(x - 7) = 0$?`,
     options:[ r`$x = 4$ und $x = -7$`, r`$x = -4$ und $x = 7$`, r`$x = 28$`, r`$x = -4$ und $x = -7$` ],
     a:1, why:r`Satz vom Nullprodukt: jeder Faktor wird einzeln null gesetzt. Aus $x + 4 = 0$ folgt $x = -4$, aus $x - 7 = 0$ folgt $x = 7$.` },

   { type:"mc", q:r`Was ist der Fehler in: &bdquo;$x^2 = 5x$, also (durch $x$ teilen) $x = 5$&ldquo;?`,
     options:[ r`Man darf Gleichungen nie durch Variablen teilen.`, r`Durch $x$ zu teilen ist nur für $x \ne 0$ erlaubt — die Lösung $x = 0$ geht verloren.`, r`Man hätte quadrieren müssen.`, r`Es ist kein Fehler, $x = 5$ ist die einzige Lösung.` ],
     a:1, why:r`Richtig ist: $x^2 - 5x = 0 \Leftrightarrow x(x - 5) = 0$, also $L = \{0, 5\}$. Beim Teilen durch einen Term, der null sein kann, gehen Lösungen verloren.` },

   { type:"input", q:r`Bringen Sie $2x^2 + 10x - 28 = 0$ in Normalform und lösen Sie. Geben Sie die <b>größere</b> Lösung an.`,
     a:["2"], why:r`Durch 2 teilen ergibt $x^2 + 5x - 14 = 0$. Mit $p = 5$, $q = -14$: $x_{1,2} = -2{,}5 \pm \sqrt{6{,}25 + 14} = -2{,}5 \pm 4{,}5$, also $x_1 = 2$ und $x_2 = -7$.`, fmt:"Zahl" }
   ]
 },

 /* ---------------------------------------------------------- 4.1 b */
 { id:"4.1", title:"Wurzel-, Exponential- und Logarithmusgleichungen",
   lead:"Gleichungen, bei denen die Unbekannte unter der Wurzel, im Exponenten oder im Logarithmus steckt — plus Substitution.",
   steps:[
   { h:"Wurzelgleichungen",
     html: r`<div class="note def"><span class="nh">Definition</span>
     Eine <b>Wurzelgleichung</b> ist eine Gleichung, bei der die unbekannte Variable mindestens einmal im Argument einer Wurzel vorkommt.</div>
     <p>Das Vorgehen: eine Wurzel durch Äquivalenzumformungen auf einer Seite <b>isolieren</b>, dann beide Seiten <b>quadrieren</b>. Gibt es noch Wurzeln, wiederholen. Danach nach $x$ auflösen — und weil Quadrieren keine Äquivalenzumformung ist, am Ende <b>Probe machen</b>.</p>
     <p>Beispiel $\sqrt{x - 1} + x = 3$:</p>`
     + D(r`\sqrt{x-1} + x = 3 \quad | -x`,
         r`\Leftrightarrow \sqrt{x-1} = 3 - x \quad | (\ldots)^2`,
         r`\Rightarrow x - 1 = 9 - 6x + x^2`,
         r`\Leftrightarrow x^2 - 7x + 10 = 0`)
     + r`<p>Die p-q-Formel liefert $x_{1,2} = \frac{7}{2} \pm \frac{3}{2}$, also die Kandidaten $x_1 = 5$ und $x_2 = 2$. Die Probe entscheidet:</p>`
     + D(r`x_1 = 5: \sqrt{4} + 5 = 7 \ne 3 \quad \text{falsch}`,
         r`x_2 = 2: \sqrt{1} + 2 = 3 \quad \text{wahr}`)
     + r`<p>Nur $x = 2$ löst die ursprüngliche Gleichung: $L = \{2\}$. Ohne Probe hätte man eine falsche Lösung mitgeschleppt.</p>` },

   { h:"Exponentialgleichungen",
     html: r`<div class="note def"><span class="nh">Definition</span>
     Eine <b>Exponentialgleichung</b> ist eine Gleichung, bei der die Variable $x$ im <b>Exponenten</b> einer Potenz vorkommt.</div>
     <p>Der Schlüssel ist die Beziehung $a^x = b \Leftrightarrow x = \log_a(b)$ für $a > 0$, $a \ne 1$ und $b > 0$. Wichtig: Die Potenz muss zuerst <b>isoliert</b> werden.</p>
     <p>Beispiel $5 \cdot e^{-x} = 7$:</p>`
     + D(r`5 \cdot e^{-x} = 7 \quad | : 5`,
         r`\Leftrightarrow e^{-x} = \frac{7}{5} \quad | \ln(\ldots)`,
         r`\Leftrightarrow -x = \ln(\frac{7}{5}) \quad | \cdot (-1)`,
         r`\Leftrightarrow x = -\ln(\frac{7}{5})`)
     + r`<div class="note warn"><span class="nh">Wenn das Argument negativ wird</span>
     Bei $3 \cdot 4^{x+1} = -6$ führt $| : 3$ auf $4^{x+1} = -2$. Der Logarithmus einer negativen Zahl ist nicht definiert — und tatsächlich ist eine Potenz nie negativ. Also $L = \emptyset$.</div>` },

   { h:"Logarithmusgleichungen",
     html: r`<div class="note def"><span class="nh">Definition</span>
     Eine <b>Logarithmusgleichung</b> ist eine Gleichung, bei der die Variable $x$ im <b>Argument</b> eines Logarithmus vorkommt.</div>
     <p>Hier nutzen wir dieselbe Beziehung mit anderem Fokus: $\log_c(x) = d \Leftrightarrow x = c^d$ für $c > 0$, $c \ne 1$ und $x > 0$. Man wendet also die Potenz zur Basis $c$ an.</p>
     <p><b>Erster Schritt ist immer der Definitionsbereich</b>, denn Logarithmen brauchen positive Argumente. Beispiel $\log_3(x - 4) = 2$: Aus $x - 4 > 0$ folgt $D = (4, \infty)$.</p>`
     + D(r`\log_3(x - 4) = 2 \quad | 3^{(\ldots)}`,
         r`\Rightarrow x - 4 = 9 \quad | +4`,
         r`\Leftrightarrow x = 13`)
     + r`<p>Beim Potenzieren verschwindet die Einschränkung an $x$ — der Definitionsbereich wird größer, deshalb steht dort nur ein Folgerungspfeil und deshalb ist auch hier die <b>Probe</b> nötig. Hier liegt $13$ in $D$, also $L = \{13\}$.</p>` },

   { h:"Mehrere Logarithmusterme",
     html: r`<p>Treten mehrere Logarithmen auf, fassen wir sie mit den Rechenregeln zusammen. Auch das kann den Definitionsbereich vergrößern — Probe also erst recht.</p>
     <p>Beispiel $\log_4(x - 1) + \log_4(x - 7) = 2$. Zuerst der Definitionsbereich: aus $x - 1 > 0$ folgt $x > 1$, aus $x - 7 > 0$ folgt $x > 7$. Beide Bedingungen zusammen ergeben $D = (7, \infty)$.</p>`
     + D(r`\log_4((x-1)(x-7)) = 2 \quad | 4^{(\ldots)}`,
         r`\Rightarrow (x-1)(x-7) = 16`,
         r`\Leftrightarrow x^2 - 8x + 7 = 16`,
         r`\Leftrightarrow x^2 - 8x - 9 = 0`,
         r`\Leftrightarrow x = 9 \text{ oder } x = -1`)
     + r`<p>Von den beiden Kandidaten liegt nur $x = 9$ im Definitionsbereich. Also $L = \{9\}$.</p>` },

   { h:"Substitution",
     html: r`<p>Manche Gleichungen sehen kompliziert aus, haben aber die Struktur einer quadratischen Gleichung. Dann hilft <b>Substitution</b>: Man ersetzt den wiederkehrenden Ausdruck durch eine neue Variable $u$, löst die einfache Gleichung und <b>substituiert zurück</b>.</p>
     <p>Beispiel $x^4 - 5x^2 + 4 = 0$ mit $u = x^2$:</p>`
     + D(r`u^2 - 5u + 4 = 0 \Leftrightarrow u = 1 \text{ oder } u = 4`,
         r`\text{Rücksubstitution: } x^2 = 1 \Rightarrow x = \pm 1, \quad x^2 = 4 \Rightarrow x = \pm 2`)
     + r`<p>Beispiel mit Logarithmus: $(\log_3(x+2))^2 - 7\log_3(x+2) + 10 = 0$. Mit $u = \log_3(x+2)$ wird daraus $u^2 - 7u + 10 = 0$ mit den Lösungen $u = 2$ und $u = 5$. Die Rücksubstitution ergibt</p>`
     + D(r`\log_3(x+2) = u \Rightarrow x + 2 = 3^u \Rightarrow x = 3^u - 2`,
         r`x = 3^2 - 2 = 7 \quad \text{oder} \quad x = 3^5 - 2 = 241`)
     + r`<p>Beide liegen im Definitionsbereich $D = (-2, \infty)$ und sind damit gültig.</p>
     <div class="note warn"><span class="nh">Nicht vergessen</span>
     Die Rücksubstitution ist kein Formalismus. Eine Lösung für $u$ ist noch keine Lösung für $x$ — und aus einem $u$ können zwei $x$ werden (wie bei $u = x^2$) oder gar keines.</div>` }
   ],
   quiz:[
   { type:"input", q:r`Lösen Sie: $\sqrt{x - 1} - 1 = 2$. Geben Sie $x$ an.`,
     a:["10"], why:r`$|+1$ ergibt $\sqrt{x-1} = 3$, quadrieren ergibt $x - 1 = 9$, also $x = 10$. Probe: $\sqrt{9} - 1 = 2$ — stimmt.`, fmt:"Zahl" },

   { type:"mc", q:r`Bei der Wurzelgleichung $\sqrt{x+3} = x - 3$ erhält man die Kandidaten $x = 1$ und $x = 6$. Was ist die Lösungsmenge?`,
     options:[ r`$L = \{1, 6\}$`, r`$L = \{6\}$`, r`$L = \{1\}$`, r`$L = \emptyset$` ],
     a:1, why:r`Probe: Für $x = 6$ ist $\sqrt{9} = 3$ und $6 - 3 = 3$ — wahr. Für $x = 1$ ist $\sqrt{4} = 2$, aber $1 - 3 = -2$ — falsch (die Wurzel ist nie negativ). Also nur $x = 6$.` },

   { type:"mc", q:r`Was ist der erste Schritt bei $4 \cdot 2^{x} = 32$?`,
     options:[ r`Sofort logarithmieren.`, r`Zuerst durch 4 teilen, um die Potenz zu isolieren.`, r`Beide Seiten quadrieren.`, r`Substitution $u = 2^x$ und danach die p-q-Formel.` ],
     a:1, why:r`Der Logarithmus wirkt nur auf die reine Potenz. Erst $| : 4$ liefert $2^x = 8$, und daraus $x = \log_2(8) = 3$.` },

   { type:"input", q:r`Lösen Sie: $3^{x} = 81$. Geben Sie $x$ an.`,
     a:["4"], why:r`$x = \log_3(81) = 4$, denn $3^4 = 81$.`, fmt:"Zahl" },

   { type:"mc", q:r`Wie lautet die Lösungsmenge von $2 \cdot 5^{x} = -10$?`,
     options:[ r`$L = \{-1\}$`, r`$L = \{1\}$`, r`$L = \emptyset$`, r`$L = \{\log_5(-5)\}$` ],
     a:2, why:r`Nach $| : 2$ steht $5^x = -5$. Eine Potenz mit positiver Basis ist immer positiv, und $\log_5(-5)$ ist nicht definiert. Es gibt keine Lösung.` },

   { type:"mc", q:r`Wie lautet der Definitionsbereich von $\ln(x - 5) = 2$?`,
     options:[ r`$D = \R$`, r`$D = (5, \infty)$`, r`$D = [5, \infty)$`, r`$D = (-\infty, 5)$` ],
     a:1, why:r`Das Argument eines Logarithmus muss <b>echt positiv</b> sein: $x - 5 > 0$, also $x > 5$. Die 5 selbst gehört nicht dazu.` },

   { type:"input", q:r`Lösen Sie: $\log_2(x + 3) = 4$. Geben Sie $x$ an.`,
     a:["13"], why:r`Potenz zur Basis 2 anwenden: $x + 3 = 2^4 = 16$, also $x = 13$. Probe: $13 + 3 = 16 > 0$, liegt im Definitionsbereich.`, fmt:"Zahl" },

   { type:"ms", q:r`Lösen Sie $x^4 - 13x^2 + 36 = 0$ durch Substitution $u = x^2$. Welche Werte lösen die Gleichung? (mehrere Antworten)`,
     options:[ r`$x = 2$`, r`$x = -2$`, r`$x = 3$`, r`$x = -3$` ],
     a:[0,1,2,3], why:r`$u^2 - 13u + 36 = 0$ hat die Lösungen $u = 4$ und $u = 9$. Die Rücksubstitution $x^2 = 4$ und $x^2 = 9$ liefert je zwei Werte — insgesamt vier Lösungen.` }
   ]
 },

 /* ---------------------------------------------------------- 4.2 */
 { id:"4.2", title:"Lineare Gleichungssysteme",
   lead:"Einsetzungs- und Additionsverfahren, die drei möglichen Lösungsfälle und Systeme mit drei Unbekannten.",
   steps:[
   { h:"Was ist ein lineares Gleichungssystem?",
     html: r`<div class="note def"><span class="nh">Definition</span>
     Für $a_{11}, a_{12}, a_{21}, a_{22}, b_1, b_2 \in \R$ heißt</div>`
     + D(r`a_{11} \cdot x + a_{12} \cdot y = b_1`,
         r`a_{21} \cdot x + a_{22} \cdot y = b_2`)
     + r`<p>ein <b>lineares Gleichungssystem</b> mit zwei Gleichungen und zwei Unbekannten. Eine Lösung sind zwei Zahlen $x$ und $y$, die <b>beide</b> Gleichungen erfüllen.</p>
     <div class="note def"><span class="nh">Nur drei Fälle sind möglich</span>
     Ein solches System hat entweder <b>keine</b> Lösung, <b>genau eine</b> Lösung oder <b>unendlich viele</b> Lösungen. Andere Fälle — etwa genau zwei Lösungen — kann es nicht geben.</div>` },

   { h:"Einsetzungsverfahren",
     html: r`<p>Die Strategie: Eine Gleichung nach einer Unbekannten auflösen und das Ergebnis in die andere Gleichung einsetzen. Welche Gleichung und welche Variable man wählt, ist gleichgültig — man nimmt die bequemste.</p>
     <p>Beispiel: $3x + 2y = 4$ (1) und $2x + y = 3$ (2). Gleichung (2) nach $y$ aufgelöst ergibt $y = 3 - 2x$. Eingesetzt in (1):</p>`
     + D(r`3x + 2 \cdot (3 - 2x) = 4`,
         r`\Leftrightarrow 3x + 6 - 4x = 4 \quad | -6`,
         r`\Leftrightarrow -x = -2 \Leftrightarrow x = 2`)
     + r`<p>Rückeinsetzen: $y = 3 - 2 \cdot 2 = -1$. Also $L = \{(2; -1)\}$.</p>
     <p>Das Verfahren ist intuitiv und funktioniert auch bei nichtlinearen oder größeren Systemen — wird dort aber schnell unübersichtlich und rechenintensiv.</p>` },

   { h:"Die anderen beiden Fälle erkennen",
     html: r`<p><b>Keine Lösung.</b> Für $x + y = 4$ (1) und $-2x - 2y = 1$ (2) setzen wir $x = 4 - y$ aus (1) in (2) ein:</p>`
     + D(r`-2 \cdot (4 - y) - 2y = 1 \Leftrightarrow -8 + 2y - 2y = 1 \Leftrightarrow -8 = 1`)
     + r`<p>Ein Widerspruch — die Variablen sind verschwunden und übrig bleibt eine falsche Aussage. Also $L = \emptyset$.</p>
     <p><b>Unendlich viele Lösungen.</b> Für $-3x + y = 1$ (1) und $6x - 2y = -2$ (2) ergibt dasselbe Vorgehen $-2 = -2$ — eine <b>wahre</b>, aber informationslose Aussage. Die zweite Gleichung ist nur das $(-2)$-fache der ersten, enthält also nichts Neues.</p>
     <p>Wir haben effektiv eine Gleichung mit zwei Unbekannten. Eine Variable ist frei wählbar, etwa $x = t \in \R$, dann ist $y = 1 + 3t$:</p>`
     + D(r`L = \{(t; 1 + 3t); t \in \R\}`)
     + r`<div class="note"><span class="nh">Faustregel</span>
     Verschwinden beim Umformen alle Variablen, sagt die übrig bleibende Aussage alles: <b>falsch</b> bedeutet keine Lösung, <b>wahr</b> bedeutet unendlich viele.</div>` },

   { h:"Additionsverfahren",
     html: r`<p>Beim <b>Additionsverfahren</b> multiplizieren wir die Gleichungen mit passenden Zahlen ungleich null, so dass beim anschließenden Addieren eine Variable verschwindet.</p>
     <p>Dasselbe System wie oben: $3x + 2y = 4$ (1), $2x + y = 3$ (2). Wir multiplizieren (2) mit $-2$:</p>`
     + D(r`3x + 2y = 4 \qquad (1)`,
         r`-4x - 2y = -6 \qquad (2')`)
     + r`<p>Die Vorfaktoren vor $y$ sind jetzt bis aufs Vorzeichen identisch. Addieren beider Gleichungen (jeweils linke und rechte Seite):</p>`
     + D(r`-x = -2 \Leftrightarrow x = 2`)
     + r`<p>Einsetzen in (1): $3 \cdot 2 + 2y = 4$, also $y = -1$. Wieder $L = \{(2; -1)\}$.</p>` },

   { h:"Drei Gleichungen, drei Unbekannte",
     html: r`<p>Das Additionsverfahren skaliert. Bei drei Unbekannten eliminiert man zunächst eine Variable aus zwei Gleichungen, dann die nächste — bis eine Gleichung mit nur einer Unbekannten übrig bleibt (Stufenform). Beispiel:</p>`
     + D(r`x - 3y - 4z = 1 \qquad (1)`,
         r`2x + y - z = 2 \qquad (2)`,
         r`5x - y - 3z = -4 \qquad (3)`)
     + r`<p>Wir rechnen $2 \cdot (1) - (2)$ und $5 \cdot (1) - (3)$, um $x$ zu eliminieren:</p>`
     + D(r`x - 3y - 4z = 1 \qquad (1')`,
         r`-7y - 7z = 0 \qquad (2')`,
         r`-14y - 17z = 9 \qquad (3')`)
     + r`<p>Jetzt $2 \cdot (2') - (3')$, um auch $y$ zu eliminieren:</p>`
     + D(r`3z = -9 \Rightarrow z = -3`)
     + r`<p>Rückwärts einsetzen: aus $(2')$ folgt $-7y + 21 = 0$, also $y = 3$; aus $(1')$ folgt $x - 9 + 12 = 1$, also $x = -2$. Damit $L = \{(-2; 3; -3)\}$.</p>` }
   ],
   quiz:[
   { type:"mc", q:r`Wie viele Lösungen kann ein lineares Gleichungssystem mit zwei Gleichungen und zwei Unbekannten haben?`,
     options:[ r`Nur genau eine`, r`Keine, genau eine oder unendlich viele`, r`Keine, eine oder genau zwei`, r`Beliebig viele, je nach Koeffizienten` ],
     a:1, why:r`Geometrisch sind es zwei Geraden: Sie schneiden sich (eine Lösung), sind parallel (keine) oder identisch (unendlich viele). Genau zwei Schnittpunkte kann es bei Geraden nicht geben.` },

   { type:"input", q:r`Lösen Sie: $x + y = 7$ und $x - y = 1$. Geben Sie $x$ an.`,
     a:["4"], why:r`Additionsverfahren: Beide Gleichungen addieren ergibt $2x = 8$, also $x = 4$ (und damit $y = 3$).`, fmt:"Zahl" },

   { type:"input", q:r`Lösen Sie: $2x + 3y = 12$ und $x = 3$. Geben Sie $y$ an.`,
     a:["2"], why:r`Einsetzen von $x = 3$ in die erste Gleichung: $6 + 3y = 12$, also $3y = 6$ und $y = 2$.`, fmt:"Zahl" },

   { type:"mc", q:r`Beim Umformen eines Systems bleibt die Aussage $0 = 5$ übrig. Was folgt daraus?`,
     options:[ r`$L = \emptyset$ — das System hat keine Lösung.`, r`Das System hat unendlich viele Lösungen.`, r`$x = 5$`, r`Es wurde falsch gerechnet — das kann nicht vorkommen.` ],
     a:0, why:r`Alle Variablen sind verschwunden und übrig bleibt ein Widerspruch. Die beiden Gleichungen sind unverträglich, geometrisch also parallele Geraden.` },

   { type:"mc", q:r`Beim Umformen bleibt die wahre Aussage $-2 = -2$ übrig. Was bedeutet das?`,
     options:[ r`Das System hat keine Lösung.`, r`Die zweite Gleichung enthält keine neue Information — es gibt unendlich viele Lösungen.`, r`Beide Variablen sind null.`, r`Das System ist eindeutig lösbar.` ],
     a:1, why:r`Die eine Gleichung ist ein Vielfaches der anderen. Effektiv bleibt eine Gleichung mit zwei Unbekannten: eine Variable ist frei wählbar, etwa $x = t$.` },

   { type:"mc", q:r`Mit welchem Faktor muss man $x + 3y = 5$ multiplizieren, damit beim Addieren zu $2x - 3y = 1$ das $y$ verschwindet?`,
     options:[ r`Mit $-1$`, r`Gar nicht — die Vorfaktoren passen schon.`, r`Mit $3$`, r`Mit $2$` ],
     a:1, why:r`Die Vorfaktoren $+3$ und $-3$ sind bereits bis aufs Vorzeichen gleich. Direktes Addieren ergibt $3x = 6$, also $x = 2$.` },

   { type:"mc", q:r`Warum verwendet man bei größeren Systemen lieber das Additionsverfahren?`,
     options:[ r`Weil das Einsetzungsverfahren dort falsche Ergebnisse liefert.`, r`Weil das Einsetzungsverfahren schnell unübersichtlich und rechenintensiv wird.`, r`Weil das Additionsverfahren auch bei nichtlinearen Systemen funktioniert.`, r`Weil es weniger Lösungen liefert.` ],
     a:1, why:r`Beide Verfahren sind korrekt. Aber das Einsetzen ineinander verschachtelter Ausdrücke wird bei drei oder mehr Unbekannten schnell unhandlich, während das Additionsverfahren systematisch auf Stufenform führt.` },

   { type:"input", q:r`Im System $x - 3y - 4z = 1$, $-7y - 7z = 0$, $3z = -9$ ergibt sich $z = -3$. Welchen Wert hat dann $y$?`,
     a:["3"], why:r`In die zweite Gleichung einsetzen: $-7y - 7 \cdot (-3) = 0$, also $-7y + 21 = 0$ und damit $y = 3$.`, fmt:"Zahl" }
   ]
 },

 /* ---------------------------------------------------------- 4.3 */
 { id:"4.3", title:"Ungleichungen",
   lead:"Was sich gegenüber Gleichungen ändert: das Umdrehen des Ungleichheitszeichens und die Fallunterscheidung.",
   steps:[
   { h:"Die vier Zeichen",
     html: r`<p>Ersetzen wir in einer Gleichung das Gleichheitszeichen durch ein Ungleichheitszeichen, entsteht eine <b>Ungleichung</b>. Es gibt vier Zeichen: $<$ kleiner, $\le$ kleiner oder gleich, $>$ größer, $\ge$ größer oder gleich.</p>
     <p>Wie bei Gleichungen gilt: Stehen auf beiden Seiten reine Zahlenwerte, ist die Ungleichung eine <b>Aussage</b> ($2 < 3$ wahr, $\sqrt{2} > 2$ falsch). Kommen Variablen vor, ist sie eine <b>Aussageform</b>: $x + 3 \le 5$ ist wahr für $x \le 2$ und sonst falsch.</p>
     <p>Ziel ist wieder, durch Äquivalenzumformungen die Lösungsmenge sichtbar zu machen.</p>` },

   { h:"Was gleich bleibt und was sich ändert",
     html: r`<p>Diese Umformungen ändern die Lösungsmenge nicht:</p>`
     + D(r`x \le y \Leftrightarrow x + c \le y + c`,
         r`x \le y \Leftrightarrow x \cdot c \le y \cdot c, \quad c > 0`)
     + r`<div class="note warn"><span class="nh">Der entscheidende Unterschied</span>
     Bei Gleichungen musste der Faktor nur $\ne 0$ sein. Bei Ungleichungen muss er <b>positiv</b> sein — sonst dreht sich das Zeichen um:</div>`
     + D(r`x \le y \Leftrightarrow x \cdot c \ge y \cdot c, \quad c < 0`)
     + r`<p>Beispiel: Aus $2 < 4$ wird nach $| \cdot (-1)$ die Aussage $-2 > -4$ — was offensichtlich stimmt.</p>
     <p>Auch das Bilden des <b>Kehrwerts</b> dreht das Zeichen um, sofern beide Seiten dasselbe Vorzeichen haben: Aus $2 < 4$ wird $\frac{1}{2} > \frac{1}{4}$.</p>` },

   { h:"Fallunterscheidung",
     html: r`<p>Problematisch wird es, wenn man mit einer <b>Variablen</b> multiplizieren muss — denn deren Vorzeichen kennt man ja noch nicht. Betrachten wir</p>`
     + D(r`\frac{1}{x} + 2 \le 4 \quad | -2`,
         r`\Leftrightarrow \frac{1}{x} \le 2 \quad | \cdot x`)
     + r`<p>Ob sich das Zeichen dreht, hängt vom Vorzeichen von $x$ ab. Die Lösung ist eine <b>Fallunterscheidung</b>.</p>
     <p><b>Fall 1: $x > 0$.</b> Das Zeichen bleibt:</p>`
     + D(r`\frac{1}{x} \le 2 \Leftrightarrow 1 \le 2x \Leftrightarrow \frac{1}{2} \le x`)
     + r`<p>Beide Bedingungen müssen gelten: $x \ge \frac{1}{2}$ <b>und</b> $x > 0$. Zusammen: $x \ge \frac{1}{2}$.</p>
     <p><b>Fall 2: $x < 0$.</b> Das Zeichen dreht sich um:</p>`
     + D(r`\frac{1}{x} \le 2 \Leftrightarrow 1 \ge 2x \Leftrightarrow \frac{1}{2} \ge x`)
     + r`<p>Beide Bedingungen: $x \le \frac{1}{2}$ <b>und</b> $x < 0$. Zusammen: $x < 0$.</p>
     <p>Den Fall $x = 0$ müssen wir nicht betrachten, weil die Ungleichung dort nicht definiert ist. Zum Schluss werden die Fälle vereinigt:</p>`
     + D(r`L = \{x \in \R; x < 0 \text{ oder } x \ge \frac{1}{2}\}`)
     + r`<div class="note"><span class="nh">Merken</span>
     Innerhalb eines Falls werden die Bedingungen mit <b>und</b> verknüpft (beide müssen gelten), am Ende werden die Fälle mit <b>oder</b> vereinigt.</div>` }
   ],
   quiz:[
   { type:"mc", q:r`Lösen Sie: $-3x > 12$`,
     options:[ r`$x > 4$`, r`$x < -4$`, r`$x > -4$`, r`$x < 4$` ],
     a:1, why:r`Division durch $-3$ ist eine Multiplikation mit einer negativen Zahl — das Zeichen dreht sich um: $x < -4$.` },

   { type:"mc", q:r`Wann muss das Ungleichheitszeichen umgedreht werden?`,
     options:[ r`Beim Addieren einer negativen Zahl`, r`Beim Multiplizieren mit einer negativen Zahl`, r`Beim Multiplizieren mit einer positiven Zahl`, r`Immer beim Umformen` ],
     a:1, why:r`Addition und Subtraktion lassen das Zeichen unverändert, egal welches Vorzeichen der Summand hat. Nur Multiplikation und Division mit einer negativen Zahl (und das Bilden des Kehrwerts) drehen es um.` },

   { type:"mc", q:r`Lösen Sie: $2x + 5 \le 11$`,
     options:[ r`$x \le 3$`, r`$x \ge 3$`, r`$x \le 8$`, r`$x \ge -3$` ],
     a:0, why:r`$| -5$ ergibt $2x \le 6$, dann $| : 2$ (positive Zahl, Zeichen bleibt) ergibt $x \le 3$.` },

   { type:"mc", q:r`Aus $3 < 5$ folgt durch Kehrwertbildung:`,
     options:[ r`$\frac{1}{3} < \frac{1}{5}$`, r`$\frac{1}{3} > \frac{1}{5}$`, r`$\frac{1}{3} = \frac{1}{5}$`, r`Der Kehrwert ist hier nicht erlaubt.` ],
     a:1, why:r`Haben beide Seiten dasselbe Vorzeichen, dreht sich das Zeichen beim Kehrwert um. Und tatsächlich: $\frac{1}{3} \approx 0{,}33 > 0{,}2 = \frac{1}{5}$.` },

   { type:"mc", q:r`Warum braucht man bei $\frac{1}{x} \le 2$ eine Fallunterscheidung?`,
     options:[ r`Weil Brüche nie in Ungleichungen vorkommen dürfen.`, r`Weil man mit $x$ multiplizieren muss, dessen Vorzeichen aber unbekannt ist.`, r`Weil $x$ auch null sein könnte.`, r`Weil die Ungleichung zwei Lösungen hat.` ],
     a:1, why:r`Beim Multiplizieren mit $x$ hängt es vom Vorzeichen ab, ob sich das Zeichen dreht. Da $x$ die gesuchte Größe ist, muss man beide Möglichkeiten getrennt untersuchen.` },

   { type:"mc", q:r`In einem Fall der Fallunterscheidung ergibt sich $x \le \frac{1}{2}$ unter der Annahme $x < 0$. Was ist die Teillösung dieses Falls?`,
     options:[ r`$x \le \frac{1}{2}$`, r`$x < 0$`, r`$0 < x \le \frac{1}{2}$`, r`Keine Lösung` ],
     a:1, why:r`Beide Bedingungen müssen gleichzeitig gelten. Jedes $x < 0$ erfüllt automatisch auch $x \le \frac{1}{2}$ — die schärfere Bedingung ist $x < 0$.` },

   { type:"ms", q:r`Welche Zahlen gehören zur Lösungsmenge $L = \{x \in \R; x < 0 \text{ oder } x \ge \frac{1}{2}\}$? (mehrere Antworten)`,
     options:[ r`$x = -3$`, r`$x = 0{,}25$`, r`$x = 0{,}5$`, r`$x = 2$` ],
     a:[0,2,3], why:r`$-3$ erfüllt $x < 0$; $0{,}5$ und $2$ erfüllen $x \ge \frac{1}{2}$. Der Wert $0{,}25$ liegt in der Lücke dazwischen und gehört nicht dazu.` }
   ]
 }
 ]
},
{
 n:"5", title:"Reelle Funktionen", lessons:[

 /* ---------------------------------------------------------- 5.1 / 5.2 */
 { id:"5.1", title:"Funktionsbegriff, Injektivität und Surjektivität",
   lead:"Definitions-, Ziel- und Wertebereich, der Graph — und wann eine Funktion injektiv, surjektiv oder bijektiv ist.",
   steps:[
   { h:"Was ist eine Funktion?",
     html: r`<p>Funktionen ordnen einer Eingangsgröße eine <b>eindeutig bestimmte</b> Ausgangsgröße zu. Ist die Ausgangsgröße nicht eindeutig, handelt es sich nicht um eine Funktion.</p>
     <div class="note def"><span class="nh">Definition</span>
     Eine <b>Funktion</b> $f$ zwischen zwei Mengen $D$ und $Z$ ist eine Abbildung, die jedem Element $x \in D$ ein eindeutiges Element $y = f(x) \in Z$ zuordnet. Wir schreiben $f: D \to Z$, $y = f(x)$.</div>
     <p>Dabei heißen:</p>
     <ul>
       <li>$D$ — <b>Definitionsbereich</b> (Definitionsmenge)</li>
       <li>$Z$ — <b>Zielbereich</b> (Zielmenge)</li>
       <li>$W = f(D) = \{f(x); x \in D\}$ — <b>Wertebereich</b>, also die Menge der tatsächlich angenommenen Werte</li>
     </ul>
     <p>Es muss <b>nicht</b> jeder Wert aus $Z$ angenommen werden, deshalb gilt immer $W \subseteq Z$. Weiter heißt $x$ das <b>Argument</b> oder die unabhängige Variable und $f(x)$ der <b>Funktionswert</b>.</p>` },

   { h:"Graph und maximaler Definitionsbereich",
     html: r`<div class="note def"><span class="nh">Graph</span>
     Der <b>Graph</b> einer Funktion $f: D \to Z$ ist die Menge aller Paare $G = \{(x, f(x)); x \in D\}$.</div>
     <p>Bei reellen Funktionen zeichnet man ihn in ein kartesisches Koordinatensystem: die Eingangsgröße auf der waagerechten Achse (<b>x-Achse</b> oder Abszisse), die Ausgangsgröße auf der senkrechten (<b>y-Achse</b> oder Ordinate).</p>
     <p>Ist kein Definitionsbereich angegeben, sondern nur die Zuordnungsvorschrift, nimmt man implizit den <b>maximalen Definitionsbereich</b> an — alle reellen Zahlen, die eingesetzt werden dürfen. Für $f(x) = \sqrt{x}$ ist das $D = \{x \in \R; x \ge 0\}$, für $f(x) = \frac{1}{x}$ wäre es $\R \setminus \{0\}$.</p>` },

   { h:"Injektiv, surjektiv, bijektiv",
     html: r`<div class="note def"><span class="nh">Definition</span>
     Gegeben sei $f: D \to Z$.<br><br>
     $f$ heißt <b>injektiv</b>, wenn gilt: $f(x_1) = f(x_2) \Rightarrow x_1 = x_2$.<br>
     $f$ heißt <b>surjektiv</b>, wenn zu jedem $y \in Z$ mindestens ein $x \in D$ existiert mit $f(x) = y$.<br>
     $f$ heißt <b>bijektiv</b>, wenn sie injektiv und surjektiv ist.</div>
     <p>Anschaulich:</p>
     <ul>
       <li><b>Injektiv</b>: Verschiedene Elemente des Definitionsbereichs werden auf verschiedene Elemente abgebildet. Äquivalent: $x_1 \ne x_2 \Rightarrow f(x_1) \ne f(x_2)$.</li>
       <li><b>Surjektiv</b>: Jedes Element der Zielmenge wird mindestens einmal getroffen — also genau dann, wenn $W = f(D) = Z$.</li>
       <li><b>Bijektiv</b>: Jedes Element der Zielmenge wird genau einmal getroffen.</li>
     </ul>
     <div class="note warn"><span class="nh">Wichtig</span>
     Surjektivität bezieht sich immer auf die <b>Zielmenge</b> $Z$, nicht auf den Wertebereich. Ob eine Funktion injektiv, surjektiv oder bijektiv ist, hängt deshalb von <b>drei</b> Dingen ab: der Funktionsvorschrift, dem Definitionsbereich <b>und</b> der Zielmenge.</div>` },

   { h:"Dieselbe Vorschrift, drei Urteile",
     html: r`<p>Wie sehr die Mengen entscheiden, zeigt $f(x) = x^2$ in drei Varianten:</p>
     <p><b>1.</b> $f: \R \to \R$, $f(x) = x^2$ — <b>weder</b> injektiv (denn $f(2) = 4 = f(-2)$, obwohl $2 \ne -2$) <b>noch</b> surjektiv (negative Zahlen werden nie angenommen, es gibt kein $x$ mit $x^2 = -1$).</p>
     <p><b>2.</b> $f: \R \to [0, \infty)$, $f(x) = x^2$ — jetzt <b>surjektiv</b>, denn jedes $y \ge 0$ hat ein Urbild ($x = \sqrt{y}$). Aber weiterhin nicht injektiv, also nicht bijektiv.</p>
     <p><b>3.</b> $f: [0, \infty) \to [0, \infty)$, $f(x) = x^2$ — jetzt <b>bijektiv</b>: Aus $x_1^2 = x_2^2$ mit $x_1, x_2 \ge 0$ folgt $x_1 = x_2$, und jedes $y \ge 0$ wird getroffen.</p>
     <p>Zum Vergleich: $f: \R \to \R$ mit $f(x) = 2x + 1$ ist bijektiv. Injektiv, weil aus $2x_1 + 1 = 2x_2 + 1$ sofort $x_1 = x_2$ folgt; surjektiv, weil sich $y = 2x + 1$ zu $x = \frac{y-1}{2}$ auflösen lässt.</p>` },

   { h:"Am Graphen ablesen",
     html: r`<div class="note def"><span class="nh">Waagerechten-Test</span>
     Eine reelle Funktion ist <b>injektiv</b>, wenn jede waagerechte Gerade den Graphen <b>höchstens</b> in einem Punkt schneidet.</div>
     <p>Hat eine waagerechte Gerade mehrere Schnittpunkte, gibt es verschiedene $x$-Werte mit demselben Funktionswert — die Funktion ist dann nicht injektiv. Bei $f(x) = x^2$ schneidet die Gerade $y = 4$ den Graphen bei $x = 2$ und $x = -2$.</p>
     <p><b>Surjektivität</b> auf $Z = \R$ bedeutet entsprechend: Der Graph besitzt zu <b>jeder</b> Höhe $y$ mindestens einen Punkt. Die Normalparabel scheitert daran, weil es unterhalb der x-Achse keine Punkte gibt.</p>
     <p>Beides zusammen — jede Waagerechte trifft den Graphen genau einmal — heißt bijektiv.</p>` }
   ],
   quiz:[
   { type:"mc", q:r`Was ist die entscheidende Bedingung dafür, dass eine Zuordnung eine Funktion ist?`,
     options:[ r`Jedem $x$ wird mindestens ein $y$ zugeordnet.`, r`Jedem $x$ wird genau ein $y$ zugeordnet.`, r`Jedem $y$ wird genau ein $x$ zugeordnet.`, r`Definitions- und Zielmenge sind gleich groß.` ],
     a:1, why:r`Eindeutigkeit der Ausgangsgröße ist der Kern des Funktionsbegriffs. Dass jedem $y$ genau ein $x$ entspricht, wäre dagegen die Bedingung für Bijektivität.` },

   { type:"mc", q:r`Welche Beziehung gilt immer zwischen Wertebereich $W$ und Zielmenge $Z$?`,
     options:[ r`$W = Z$`, r`$W \subseteq Z$`, r`$Z \subseteq W$`, r`$W \cap Z = \emptyset$` ],
     a:1, why:r`Der Wertebereich enthält nur die tatsächlich angenommenen Werte, ist also stets eine Teilmenge der Zielmenge. Gleichheit $W = Z$ gilt genau dann, wenn die Funktion surjektiv ist.` },

   { type:"mc", q:r`Wie lautet der maximale Definitionsbereich von $f(x) = \sqrt{x - 3}$?`,
     options:[ r`$D = \R$`, r`$D = (3, \infty)$`, r`$D = [3, \infty)$`, r`$D = (-\infty, 3]$` ],
     a:2, why:r`Unter der Wurzel darf keine negative Zahl stehen: $x - 3 \ge 0$, also $x \ge 3$. Die 3 selbst ist erlaubt, denn $\sqrt{0} = 0$ — daher die eckige Klammer.` },

   { type:"mc", q:r`Warum ist $f: \R \to \R$ mit $f(x) = x^2$ nicht injektiv?`,
     options:[ r`Weil negative Werte nicht angenommen werden.`, r`Weil $f(2) = f(-2) = 4$ gilt, obwohl $2 \ne -2$.`, r`Weil der Definitionsbereich zu groß ist.`, r`Weil sie nicht stetig ist.` ],
     a:1, why:r`Injektivität verlangt, dass verschiedene Argumente verschiedene Funktionswerte haben. Hier liefern zwei verschiedene $x$ denselben Wert. (Dass negative Werte fehlen, betrifft die Surjektivität.)` },

   { type:"mc", q:r`Die Funktion $f: \R \to [0, \infty)$, $f(x) = x^2$ ist ...`,
     options:[ r`injektiv, aber nicht surjektiv`, r`surjektiv, aber nicht injektiv`, r`bijektiv`, r`weder injektiv noch surjektiv` ],
     a:1, why:r`Durch die verkleinerte Zielmenge wird sie surjektiv — jedes $y \ge 0$ hat ein Urbild. Injektiv wird sie dadurch nicht, dafür müsste man auch den Definitionsbereich auf $[0, \infty)$ einschränken.` },

   { type:"mc", q:r`Eine waagerechte Gerade schneidet den Graphen von $f$ in drei Punkten. Was folgt daraus?`,
     options:[ r`$f$ ist nicht injektiv.`, r`$f$ ist nicht surjektiv.`, r`$f$ ist keine Funktion.`, r`$f$ ist bijektiv.` ],
     a:0, why:r`Drei Schnittpunkte bedeuten drei verschiedene $x$-Werte mit demselben Funktionswert — genau der Widerspruch zur Injektivität. (Mehrere Schnittpunkte einer <b>senkrechten</b> Geraden würden dagegen bedeuten, dass es gar keine Funktion ist.)` },

   { type:"ms", q:r`Wovon hängt es ab, ob eine Funktion bijektiv ist? (mehrere Antworten)`,
     options:[ r`Von der Funktionsvorschrift`, r`Vom Definitionsbereich`, r`Von der Zielmenge`, r`Vom Namen der Variablen` ],
     a:[0,1,2], why:r`Alle drei zusammen entscheiden. $f(x) = x^2$ ist je nach Wahl von $D$ und $Z$ weder injektiv noch surjektiv, nur surjektiv oder sogar bijektiv.` },

   { type:"mc", q:r`Ist $f: \R \to \R$ mit $f(x) = 2x + 1$ bijektiv?`,
     options:[ r`Ja — sie ist injektiv und surjektiv.`, r`Nein, sie ist nur injektiv.`, r`Nein, sie ist nur surjektiv.`, r`Nein, sie ist weder das eine noch das andere.` ],
     a:0, why:r`Aus $2x_1 + 1 = 2x_2 + 1$ folgt $x_1 = x_2$ (injektiv), und $y = 2x + 1$ lässt sich für jedes $y$ zu $x = \frac{y-1}{2}$ auflösen (surjektiv).` }
   ]
 },

 /* ---------------------------------------------------------- 5.3 / 5.4 */
 { id:"5.3", title:"Eigenschaften und zusammengesetzte Funktionen",
   lead:"Nullstellen, Symmetrie, Monotonie — sowie Verknüpfung, Komposition und Umkehrfunktion.",
   steps:[
   { h:"Nullstellen",
     html: r`<div class="note def"><span class="nh">Definition</span>
     Die <b>Nullstellen</b> einer Funktion $f: D \to \R$ sind die Stellen $x \in D$, an denen $f(x) = 0$ gilt.</div>
     <p>Anschaulich sind das die $x$-Koordinaten der Schnittpunkte des Graphen mit der x-Achse. Bestimmt werden sie, indem man die Gleichung $f(x) = 0$ nach $x$ auflöst — womit alles aus Kapitel 4 wieder ins Spiel kommt.</p>
     <p>Eine Funktion kann keine, eine, mehrere oder sogar unendlich viele Nullstellen haben: $f(x) = x^2 + 1$ hat keine, $f(x) = x^2 - 4$ hat zwei, $f(x) = \sin(x)$ hat unendlich viele.</p>` },

   { h:"Symmetrie",
     html: r`<p>Voraussetzung ist ein <b>symmetrischer</b> Definitionsbereich: Aus $x \in D$ muss auch $-x \in D$ folgen.</p>
     <div class="note def"><span class="nh">Definition</span>
     $f$ heißt <b>achsensymmetrisch</b> oder <b>gerade</b>, wenn für alle $x \in D$ gilt: $f(-x) = f(x)$.<br><br>
     $f$ heißt <b>punktsymmetrisch</b> oder <b>ungerade</b>, wenn für alle $x \in D$ gilt: $f(-x) = -f(x)$.</div>
     <p>Anschaulich: Der Graph einer achsensymmetrischen Funktion geht durch Spiegelung an der <b>y-Achse</b> in sich selbst über, der einer punktsymmetrischen durch Punktspiegelung am <b>Koordinatenursprung</b>.</p>
     <p>Beispiele: $f(x) = x^2$ ist gerade, denn $(-x)^2 = x^2$. $f(x) = x^3$ ist ungerade, denn $(-x)^3 = -x^3$. Die Namen kommen von den Potenzen — gerade Exponenten liefern gerade Funktionen. $f(x) = x^2 + x$ ist weder das eine noch das andere.</p>` },

   { h:"Monotonie",
     html: r`<p>Das Monotonieverhalten sagt, wie sich die Funktionswerte in einem Bereich verändern. Für $f: D \to \R$ und alle $x, y \in D$ mit $x < y$:</p>
     <div class="note def"><span class="nh">Definition</span>
     <b>monoton steigend</b> (wachsend): $f(x) \le f(y)$<br>
     <b>streng monoton steigend</b>: $f(x) < f(y)$<br>
     <b>monoton fallend</b>: $f(x) \ge f(y)$<br>
     <b>streng monoton fallend</b>: $f(x) > f(y)$</div>
     <p>Der Unterschied liegt allein im $\le$ gegenüber $<$: Eine monoton steigende Funktion darf waagerechte Stücke haben, eine streng monoton steigende nicht.</p>
     <div class="note"><span class="nh">Zusammenhang zur Injektivität</span>
     Eine streng monotone Funktion ist immer injektiv — sie kann keinen Wert zweimal annehmen. Das Monotonieverhalten hängt dabei stets vom <b>betrachteten Definitionsbereich</b> ab: $f(x) = x^2$ ist auf $[0, \infty)$ streng monoton steigend, auf ganz $\R$ aber überhaupt nicht monoton.</div>` },

   { h:"Verknüpfung mit Konstanten",
     html: r`<p>Zwei Funktionen $f, g: D \to \R$ lassen sich mit den bekannten Rechenarten zu neuen Funktionen verbinden:</p>`
     + D(r`h_1(x) = f(x) + g(x), \quad h_2(x) = f(x) \cdot g(x), \quad h_3(x) = \frac{f(x)}{g(x)}`)
     + r`<p>Bei $h_3$ muss $g(x) \ne 0$ für alle $x \in D$ gelten. Besonders anschaulich ist der Spezialfall, dass eine der Funktionen eine <b>Konstante</b> $c$ ist:</p>
     <ul>
       <li><b>Addition</b> von $c$: Der Graph wird parallel zur y-Achse <b>verschoben</b>.</li>
       <li><b>Multiplikation</b> mit $c$: Der Graph wird <b>gestreckt</b> ($|c| > 1$) oder <b>gestaucht</b> ($|c| < 1$). Ist $c < 0$, wird er zusätzlich an der x-Achse gespiegelt.</li>
     </ul>` },

   { h:"Komposition",
     html: r`<p>Funktionen lassen sich auch <b>hintereinander ausführen</b>.</p>
     <div class="note def"><span class="nh">Komposition</span>
     Sind $f: D \to W$ und $g: W \to \R$, so ist die <b>Komposition</b> (Verkettung) $g \circ f$ definiert durch $(g \circ f)(x) = g(f(x))$.</div>
     <p>Gelesen wird $g \circ f$ als &bdquo;$g$ nach $f$&ldquo; — zuerst wirkt die <b>innere</b> Funktion $f$. Beispiel mit $f(x) = 2x + 3$ und $g(x) = \frac{1}{x^2 + 1}$:</p>`
     + D(r`(g \circ f)(x) = g(f(x)) = \frac{1}{(2x+3)^2 + 1}`,
         r`(f \circ g)(x) = f(g(x)) = \frac{2}{x^2+1} + 3`)
     + r`<p>Die Reihenfolge ist also wesentlich: Im Allgemeinen gilt $g \circ f \ne f \circ g$.</p>` },

   { h:"Umkehrfunktion",
     html: r`<div class="note def"><span class="nh">Umkehrfunktion</span>
     $f: D \to W$ heißt <b>invertierbar</b> (umkehrbar), wenn es eine Funktion $g: W \to D$ gibt mit $g(f(x)) = x$ für alle $x \in D$ und $f(g(y)) = y$ für alle $y \in W$. Dann heißt $g$ die <b>Umkehrfunktion</b> von $f$, geschrieben $f^{-1}$.</div>
     <div class="note warn"><span class="nh">Keine Potenz</span>
     Die $-1$ in $f^{-1}$ ist <b>kein</b> Exponent. $f^{-1}(x)$ ist die Umkehrfunktion, nicht $\frac{1}{f(x)}$.</div>
     <p>Wann existiert sie? Das hängt davon ab, worauf sich die Umkehrung beziehen soll:</p>
     <ul>
       <li>$f: D \to Z$ ist genau dann auf der <b>Zielmenge</b> $Z$ umkehrbar, wenn sie <b>bijektiv</b> ist.</li>
       <li>$f: D \to W$ mit $W = f(D)$ ist genau dann umkehrbar, wenn sie <b>injektiv</b> ist — die Surjektivität auf $W$ ist ja automatisch erfüllt.</li>
     </ul>
     <p>Falls die Umkehrfunktion existiert, ist sie eindeutig bestimmt.</p>` },

   { h:"Umkehrfunktion bestimmen",
     html: r`<p>Das Rezept hat zwei Schritte:</p>
     <ol>
       <li>$y = f(x)$ nach $x$ auflösen, also $x = f^{-1}(y)$.</li>
       <li>Die Bezeichnungen $x$ und $y$ vertauschen, also $y = f^{-1}(x)$.</li>
     </ol>
     <p>Beispiel $f(x) = 2x + 1$: Aus $y = 2x + 1$ folgt $x = \frac{y - 1}{2}$, nach Umbenennen also</p>`
     + D(r`f^{-1}(x) = \frac{x - 1}{2}`)
     + r`<p>Ebenso gut kann man in $y = f(x)$ zuerst $x$ und $y$ vertauschen und dann $x = f(y)$ nach $y$ auflösen.</p>
     <div class="note"><span class="nh">Anschaulich</span>
     Den Graphen der Umkehrfunktion erhält man, indem man den Graphen von $f$ an der Winkelhalbierenden $y = x$ spiegelt.</div>
     <p>Übrigens haben wir Umkehrfunktionen längst benutzt: Die Wurzel kehrt das Potenzieren um, der Logarithmus die Exponentialfunktion. Genau deshalb funktioniert das Auflösen von Gleichungen.</p>` }
   ],
   quiz:[
   { type:"input", q:r`Bestimmen Sie die <b>positive</b> Nullstelle von $f(x) = x^2 - 16$.`,
     a:["4"], why:r`$x^2 - 16 = 0 \Leftrightarrow x^2 = 16 \Leftrightarrow x = \pm 4$. Die positive Nullstelle ist 4.`, fmt:"Zahl" },

   { type:"mc", q:r`Welche Funktion ist <b>achsensymmetrisch</b> (gerade)?`,
     options:[ r`$f(x) = x^3$`, r`$f(x) = x^4 + 2$`, r`$f(x) = x^3 + x$`, r`$f(x) = x^2 + x$` ],
     a:1, why:r`Es muss $f(-x) = f(x)$ gelten. Für $x^4 + 2$ ist $(-x)^4 + 2 = x^4 + 2$ — passt. $x^3$ und $x^3+x$ sind punktsymmetrisch, $x^2 + x$ ist keins von beiden.` },

   { type:"mc", q:r`Für welche Funktion gilt $f(-x) = -f(x)$?`,
     options:[ r`$f(x) = x^2$`, r`$f(x) = x^3$`, r`$f(x) = |x|$`, r`$f(x) = x^2 + 1$` ],
     a:1, why:r`$(-x)^3 = -x^3$, also ist $x^3$ punktsymmetrisch (ungerade). Die anderen drei sind achsensymmetrisch.` },

   { type:"mc", q:r`Was ist der Unterschied zwischen monoton und streng monoton steigend?`,
     options:[ r`Streng monoton steigend erlaubt keine waagerechten Stücke ($f(x) < f(y)$ statt $f(x) \le f(y)$).`, r`Monoton steigend gilt nur auf Intervallen.`, r`Streng monoton steigend bedeutet, dass die Funktion positiv ist.`, r`Es gibt keinen Unterschied.` ],
     a:0, why:r`Bei $x < y$ verlangt streng monoton steigend echt größere Werte. Eine streng monotone Funktion ist deshalb immer injektiv — eine nur monotone nicht.` },

   { type:"mc", q:r`Auf welchem Bereich ist $f(x) = x^2$ streng monoton steigend?`,
     options:[ r`Auf ganz $\R$`, r`Auf $[0, \infty)$`, r`Auf $(-\infty, 0]$`, r`Nirgends` ],
     a:1, why:r`Rechts von der Null wachsen die Werte, links fallen sie. Monotonie ist deshalb immer eine Aussage über einen <b>bestimmten</b> Bereich.` },

   { type:"mc", q:r`Gegeben $f(x) = x + 1$ und $g(x) = x^2$. Was ist $(g \circ f)(x)$?`,
     options:[ r`$x^2 + 1$`, r`$(x + 1)^2$`, r`$x^3 + x^2$`, r`$x^2 + x + 1$` ],
     a:1, why:r`$(g \circ f)(x) = g(f(x))$ — zuerst wirkt die innere Funktion $f$: $g(x+1) = (x+1)^2$. Zum Vergleich: $(f \circ g)(x) = x^2 + 1$.` },

   { type:"mc", q:r`Was bedeutet das Symbol $f^{-1}$?`,
     options:[ r`Den Kehrwert $\frac{1}{f(x)}$`, r`Die Umkehrfunktion von $f$`, r`Die Ableitung von $f$`, r`Die Funktion $f$ mit negativem Vorzeichen` ],
     a:1, why:r`Die $-1$ ist hier kein Exponent, sondern die Kennzeichnung der Umkehrfunktion. Der Kehrwert wäre $(f(x))^{-1}$.` },

   { type:"mc", q:r`Wann besitzt $f: D \to Z$ eine Umkehrfunktion $f^{-1}: Z \to D$?`,
     options:[ r`Wenn $f$ injektiv ist.`, r`Wenn $f$ surjektiv ist.`, r`Wenn $f$ bijektiv ist.`, r`Immer.` ],
     a:2, why:r`Auf der Zielmenge $Z$ braucht es beides: Injektivität, damit jeder Wert höchstens ein Urbild hat, und Surjektivität, damit jedes Element von $Z$ überhaupt getroffen wird. Betrachtet man stattdessen nur $W = f(D)$, genügt Injektivität.` },

   { type:"mc", q:r`Bestimmen Sie die Umkehrfunktion von $f(x) = 3x - 6$.`,
     options:[ r`$f^{-1}(x) = \frac{x + 6}{3}$`, r`$f^{-1}(x) = \frac{1}{3x - 6}$`, r`$f^{-1}(x) = 3x + 6$`, r`$f^{-1}(x) = \frac{x - 6}{3}$` ],
     a:0, why:r`Aus $y = 3x - 6$ folgt $y + 6 = 3x$, also $x = \frac{y + 6}{3}$. Nach Umbenennen der Variablen: $f^{-1}(x) = \frac{x + 6}{3}$.` },

   { type:"mc", q:r`Wie erhält man den Graphen der Umkehrfunktion aus dem Graphen von $f$?`,
     options:[ r`Durch Spiegelung an der x-Achse`, r`Durch Spiegelung an der y-Achse`, r`Durch Spiegelung an der Winkelhalbierenden $y = x$`, r`Durch Verschiebung um 1 nach rechts` ],
     a:2, why:r`Beim Umkehren tauschen Eingangs- und Ausgangsgröße die Rollen — das entspricht genau dem Vertauschen der Achsen, also der Spiegelung an $y = x$.` }
   ]
 }
 ]
}
];

var LESSONS = [];
COURSE.forEach(function(ch, ci){
  ch.lessons.forEach(function(ls, li){
    ls.key = "k" + ci + "l" + li; ls.chap = ch; ls.chapIdx = ci;
    LESSONS.push(ls);
  });
});
var EXAM_KEY = "exam", EXAM_SIZE = 24, PASS = 70;

var STORE = "vorkurs-mathe-v1";
var S = { pos:0, mode:"learn", step:0, qi:0, given:[], sel:null, checked:false, pool:null, progress:{} };

function load(){
  try{
    var raw = localStorage.getItem(STORE);
    if(!raw) return;
    var d = JSON.parse(raw);
    if(d && typeof d === "object"){
      S.progress = d.progress || {};
      if(typeof d.pos === "number" && d.pos >= 0 && d.pos < LESSONS.length) S.pos = d.pos;
    }
  }catch(e){}
}
function save(){
  try{ localStorage.setItem(STORE, JSON.stringify({ pos:S.pos, progress:S.progress })); }catch(e){}
}

function prog(key){ return S.progress[key] || null; }
function passed(key){ var p = prog(key); return !!p && p.pct >= PASS; }
function doneCount(){ return LESSONS.filter(function(l){ return passed(l.key); }).length; }

function el(id){ return document.getElementById(id); }
function norm(v){
  return String(v).toLowerCase().replace(/−/g, "-").replace(/\s+/g, "")
         .replace(/,/g, ".").replace(/^\+/, "");
}

/* ------------------------------------------------------------ Rail */
function renderRail(){
  var h = "";
  COURSE.forEach(function(ch, ci){
    h += '<div class="chap"><div class="chap-h"><i>' + ch.n + "</i>" + ch.title + "</div>";
    ch.lessons.forEach(function(ls){
      var i = LESSONS.indexOf(ls), p = prog(ls.key);
      var cls = passed(ls.key) ? "mark done" : (p ? "mark part" : "mark");
      var glyph = passed(ls.key) ? "✓" : (p ? "·" : "");
      h += '<button class="lrow" type="button" data-go="' + i + '"' +
           (S.pos === i && !isExamMode() ? ' aria-current="true"' : "") + ">" +
           '<span class="' + cls + '">' + glyph + "</span>" +
           '<span class="lname"><em>' + ls.id + "</em>" + ls.title + "</span>" +
           '<span class="lscore">' + (p && p.total ? p.pct + "%" : "") + "</span></button>";
    });
    h += "</div>";
  });
  var ep = prog(EXAM_KEY);
  h += '<div class="chap"><div class="chap-h"><i>&#9873;</i>Abschluss</div>' +
       '<button class="lrow" type="button" data-exam="1"' + (isExamMode() ? ' aria-current="true"' : "") + ">" +
       '<span class="' + (ep && ep.pct >= PASS ? "mark done" : (ep ? "mark part" : "mark")) + '">' +
       (ep && ep.pct >= PASS ? "✓" : (ep ? "·" : "")) + "</span>" +
       '<span class="lname">Abschlussprüfung</span>' +
       '<span class="lscore">' + (ep && ep.total ? ep.pct + "%" : EXAM_SIZE + " Fr.") + "</span></button></div>";
  el("railbox").innerHTML = h;

  var d = doneCount(), C = 119.4;
  el("gring").setAttribute("stroke-dashoffset", String(C - C * d / LESSONS.length));
  el("gnum").textContent = d + " von " + LESSONS.length;
  var cur = isExamMode() ? "Abschlussprüfung" : (LESSONS[S.pos].id + " " + LESSONS[S.pos].title);
  el("mobnow").textContent = cur;
}

/* ------------------------------------------------------------ Views */
function stepBar(n, cur){
  var h = '<div class="steps">';
  for(var i = 0; i < n; i++) h += "<span class=\"" + (i < cur ? "on" : (i === cur ? "cur" : "")) + "\"></span>";
  return h + "</div>";
}

function renderLearn(){
  var L = LESSONS[S.pos], st = L.steps[S.step], last = S.step === L.steps.length - 1;
  var h = '<div class="crumb"><span>Kapitel ' + L.chap.n + "</span><span class=\"dot\"></span><span>Lektion " + L.id + "</span></div>" +
    "<h1>" + L.title + "</h1>" +
    '<p class="lead">' + md(L.lead) + "</p>" +
    stepBar(L.steps.length + 1, S.step) +
    '<section class="card"><div class="card-h"><span class="kicker">Schritt ' + (S.step + 1) + " / " + L.steps.length + "</span>" +
    "<h2>" + md(st.h) + '</h2></div><div class="body">' + md(st.html) + "</div></section>" +
    '<div class="nav">' +
    '<button class="btn sec" type="button" data-act="prev"' + (S.step === 0 && S.pos === 0 ? " disabled" : "") + ">Zurück</button>" +
    '<button class="btn" type="button" data-act="next" data-primary="1">' + (last ? "Zur Lernkontrolle" : "Weiter") + "</button>" +
    '<span class="spacer"></span><span class="hintline">Enter</span></div>';
  el("view").innerHTML = h;
}

function isExamMode(){ return S.mode === "exam" || S.mode === "examresult"; }
function quizList(){ return isExamMode() ? S.pool : LESSONS[S.pos].quiz; }

function renderQuiz(){
  var qs = quizList(), q = qs[S.qi];
  var isExam = isExamMode();
  var title = isExam ? "Abschlussprüfung" : LESSONS[S.pos].title;
  var crumb = isExam
    ? '<div class="crumb"><span>Abschluss</span><span class="dot"></span><span>alle Kapitel</span></div>'
    : '<div class="crumb"><span>Kapitel ' + LESSONS[S.pos].chap.n + '</span><span class="dot"></span><span>Lernkontrolle ' + LESSONS[S.pos].id + "</span></div>";

  var h = crumb + "<h1>" + title + "</h1>";
  h += isExam
    ? '<p class="lead">' + EXAM_SIZE + " Fragen quer durch alle fünf Kapitel. Ab " + PASS + " % bestanden.</p>"
    : '<p class="lead">' + qs.length + " Fragen zur Lektion. Ab " + PASS + " % ist die Lektion bestanden.</p>";
  h += stepBar(isExam ? qs.length : LESSONS[S.pos].steps.length + 1,
               isExam ? S.qi : LESSONS[S.pos].steps.length);

  var kind = q.type === "ms" ? "Mehrfachauswahl" : (q.type === "input" ? "Freie Eingabe" : "Eine Antwort");
  h += '<section class="card"><div class="body">' +
       '<div class="qhead"><span class="qmeta">Frage ' + (S.qi + 1) + " / " + qs.length + '</span><span class="qmeta">' + kind + "</span></div>" +
       '<p class="qtext">' + md(q.q) + "</p>";

  if(q.type === "input"){
    h += '<div class="freein"><input id="ans" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" ' +
         'placeholder="Antwort eingeben"' + (S.checked ? " disabled" : "") +
         (S.checked ? ' value="' + String(S.sel || "").replace(/"/g, "&quot;") + '"' : "") + ">" +
         '<span class="fmt">' + (q.fmt || "Antwort") + "</span></div>";
  } else {
    h += '<div class="opts">';
    q.options.forEach(function(o, i){
      var c = "opt", chosen = (q.type === "ms") ? (S.sel || []).indexOf(i) >= 0 : S.sel === i;
      if(S.checked){
        var right = (q.type === "ms") ? q.a.indexOf(i) >= 0 : q.a === i;
        if(right) c += " ok"; else if(chosen) c += " no";
      } else if(chosen) c += " sel";
      h += '<button class="' + c + '" type="button" data-opt="' + i + '"' + (S.checked ? " disabled" : "") + ">" +
           '<span class="key">' + (i + 1) + "</span><span>" + md(o) + "</span></button>";
    });
    h += "</div>";
  }

  if(S.checked){
    var ok = S.given[S.qi];
    h += '<div class="verdict ' + (ok ? "ok" : "no") + '"><div class="vh">' +
         (ok ? "✓ Richtig" : "✕ Noch nicht") + "</div>" + md(q.why) + "</div>";
  }
  h += "</div></section>";

  h += '<div class="nav">';
  if(!S.checked){
    h += '<button class="btn" type="button" data-act="check" data-primary="1">Prüfen</button>' +
         '<span class="spacer"></span><span class="hintline">' +
         (q.type === "input" ? "Enter zum Prüfen" : "Tasten 1–" + q.options.length + " oder klicken") + "</span>";
  } else {
    h += '<button class="btn" type="button" data-act="nextq" data-primary="1">' +
         (S.qi === qs.length - 1 ? "Zur Auswertung" : "Nächste Frage") + "</button>" +
         '<span class="spacer"></span><span class="hintline">Enter</span>';
  }
  h += "</div>";
  el("view").innerHTML = h;
  var inp = el("ans");
  if(inp && !S.checked) inp.focus();
}

function renderResult(){
  var qs = quizList(), isExam = isExamMode();
  var score = S.given.filter(Boolean).length, total = qs.length;
  var pct = Math.round(score / total * 100), ok = pct >= PASS;
  var key = isExam ? EXAM_KEY : LESSONS[S.pos].key;
  var prev = prog(key);
  if(!prev || pct > prev.pct) S.progress[key] = { pct:pct, score:score, total:total };
  save();

  var C = 301.6, off = C - C * pct / 100;
  var head = ok
    ? (isExam ? "Abschlussprüfung bestanden" : "Lektion bestanden")
    : (pct >= 50 ? "Fast geschafft" : "Da ist noch Luft");
  var sub = ok
    ? (isExam ? "Sie haben den kompletten Vorkursstoff sicher im Griff." : "Weiter zur nächsten Lektion — oder die Fragen noch einmal durchgehen.")
    : "Ab " + PASS + " % gilt die Lernkontrolle als bestanden. Gehen Sie die falsch beantworteten Fragen unten durch und wiederholen Sie sie.";

  var h = '<div class="crumb"><span>' + (isExam ? "Abschluss" : "Kapitel " + LESSONS[S.pos].chap.n) +
          '</span><span class="dot"></span><span>Auswertung</span></div>' +
          "<h1>" + (isExam ? "Abschlussprüfung" : LESSONS[S.pos].title) + "</h1>" +
          '<section class="card" style="margin-top:22px"><div class="result">' +
          '<div class="ring"><svg width="112" height="112" viewBox="0 0 112 112" aria-hidden="true">' +
          '<circle cx="56" cy="56" r="48" fill="none" stroke="var(--line)" stroke-width="9"></circle>' +
          '<circle cx="56" cy="56" r="48" fill="none" stroke="' + (ok ? "var(--good)" : "var(--bad)") +
          '" stroke-width="9" stroke-linecap="round" stroke-dasharray="' + C + '" stroke-dashoffset="' + off +
          '" transform="rotate(-90 56 56)"></circle></svg><b>' + pct + "%</b></div>" +
          '<div class="rtxt"><h3>' + head + "</h3><p>" + score + " von " + total + " Fragen richtig. " + sub + "</p></div></div>";

  h += '<div class="review"><h4>Alle Fragen im Überblick</h4>';
  qs.forEach(function(q, i){
    var good = S.given[i];
    h += '<div class="ritem"><span class="ric ' + (good ? "ok" : "no") + '">' + (good ? "✓" : "✕") + "</span>" +
         "<span>" + md(q.q) + (good ? "" : "<small>" + md(q.why) + "</small>") + "</span></div>";
  });
  h += "</div></section>";

  h += '<div class="nav">';
  if(isExam){
    h += '<button class="btn" type="button" data-act="exam" data-primary="1">Prüfung wiederholen</button>' +
         '<button class="btn sec" type="button" data-go="0">Zurück zu Lektion 1.1</button>';
  } else if(ok && S.pos < LESSONS.length - 1){
    h += '<button class="btn" type="button" data-act="nextlesson" data-primary="1">Nächste Lektion: ' +
         LESSONS[S.pos + 1].id + " " + LESSONS[S.pos + 1].title + "</button>" +
         '<button class="btn sec" type="button" data-act="retry">Wiederholen</button>';
  } else if(ok){
    h += '<button class="btn" type="button" data-act="exam" data-primary="1">Zur Abschlussprüfung</button>' +
         '<button class="btn sec" type="button" data-act="retry">Wiederholen</button>';
  } else {
    h += '<button class="btn" type="button" data-act="retry" data-primary="1">Lernkontrolle wiederholen</button>' +
         '<button class="btn sec" type="button" data-act="reread">Lektion noch einmal lesen</button>';
  }
  h += "</div>";
  el("view").innerHTML = h;
}

function render(){
  if(S.mode === "learn") renderLearn();
  else if(S.mode === "quiz" || S.mode === "exam") renderQuiz();
  else renderResult();
  renderRail();
  window.scrollTo(0, 0);
}

/* ------------------------------------------------------------ Aktionen */
function goLesson(i, atStep){
  S.pos = i; S.mode = "learn"; S.step = atStep || 0;
  S.qi = 0; S.given = []; S.sel = null; S.checked = false; S.pool = null;
  if(!S.progress[LESSONS[i].key]) S.progress[LESSONS[i].key] = { pct:0, score:0, total:0 };
  save(); render();
}
function startQuiz(){
  S.mode = "quiz"; S.qi = 0; S.given = []; S.sel = null; S.checked = false; render();
}
function startExam(){
  var all = [];
  LESSONS.forEach(function(l){ l.quiz.forEach(function(q){ all.push(q); }); });
  for(var i = all.length - 1; i > 0; i--){ var j = Math.floor(Math.random() * (i + 1)); var t = all[i]; all[i] = all[j]; all[j] = t; }
  S.pool = all.slice(0, Math.min(EXAM_SIZE, all.length));
  S.mode = "exam"; S.qi = 0; S.given = []; S.sel = null; S.checked = false;
  render();
}
function check(){
  var q = quizList()[S.qi], ok = false;
  if(q.type === "input"){
    var inp = el("ans"); if(!inp) return;
    var v = inp.value; if(!v.trim()) { inp.focus(); return; }
    S.sel = v;
    ok = q.a.some(function(a){ return norm(a) === norm(v); });
  } else if(q.type === "ms"){
    var sel = (S.sel || []).slice().sort(function(a,b){return a-b;});
    if(!sel.length) return;
    var want = q.a.slice().sort(function(a,b){return a-b;});
    ok = sel.length === want.length && sel.every(function(x, i){ return x === want[i]; });
  } else {
    if(S.sel === null) return;
    ok = S.sel === q.a;
  }
  S.given[S.qi] = ok; S.checked = true; render();
}
function nextQ(){
  var qs = quizList();
  if(S.qi === qs.length - 1){ S.mode = S.mode === "exam" ? "examresult" : "result"; render(); return; }
  S.qi++; S.sel = null; S.checked = false; render();
}

/* ------------------------------------------------------------ Events */
document.addEventListener("click", function(e){
  if(!e.target || !e.target.closest) return;
  var t = e.target.closest("[data-go],[data-exam],[data-act],[data-opt]");
  if(!t) return;
  if(t.hasAttribute("data-go")){ goLesson(parseInt(t.getAttribute("data-go"), 10), 0); closeRail(); return; }
  if(t.hasAttribute("data-exam")){ startExam(); closeRail(); return; }
  if(t.hasAttribute("data-opt")){
    var i = parseInt(t.getAttribute("data-opt"), 10), q = quizList()[S.qi];
    if(q.type === "ms"){
      var a = S.sel || []; var k = a.indexOf(i);
      if(k >= 0) a.splice(k, 1); else a.push(i);
      S.sel = a;
    } else S.sel = i;
    render(); return;
  }
  var act = t.getAttribute("data-act"), L = LESSONS[S.pos];
  if(act === "next"){
    if(S.step < L.steps.length - 1){ S.step++; render(); }
    else startQuiz();
  } else if(act === "prev"){
    if(S.step > 0){ S.step--; render(); }
    else if(S.pos > 0) goLesson(S.pos - 1, LESSONS[S.pos - 1].steps.length - 1);
  } else if(act === "check") check();
  else if(act === "nextq") nextQ();
  else if(act === "retry") { S.mode = S.mode === "examresult" ? "exam" : "quiz"; S.qi = 0; S.given = []; S.sel = null; S.checked = false; render(); }
  else if(act === "reread") { S.mode = "learn"; S.step = 0; render(); }
  else if(act === "nextlesson") goLesson(S.pos + 1, 0);
  else if(act === "exam") startExam();
});

document.addEventListener("keydown", function(e){
  if(e.metaKey || e.ctrlKey || e.altKey) return;
  var inField = e.target && e.target.tagName === "INPUT";
  if(e.key === "Enter"){
    var p = document.querySelector("[data-primary]");
    if(p){ e.preventDefault(); p.click(); }
    return;
  }
  if(inField) return;
  if((S.mode === "quiz" || S.mode === "exam") && !S.checked && /^[1-9]$/.test(e.key)){
    var b = document.querySelector('[data-opt="' + (parseInt(e.key, 10) - 1) + '"]');
    if(b){ e.preventDefault(); b.click(); }
  }
});

function closeRail(){ el("railbox").classList.remove("open"); }
el("mobtoggle").addEventListener("click", function(){ el("railbox").classList.toggle("open"); });
el("reset").addEventListener("click", function(){
  if(!confirm("Gesamten Lernfortschritt löschen?")) return;
  S.progress = {}; S.pos = 0; save(); goLesson(0, 0);
});

/* ------------------------------------------------------------ Start */
load();
S.mode = "learn"; S.step = 0;
render();
})();
</script>
