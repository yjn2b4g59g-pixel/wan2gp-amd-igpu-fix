  @keyframes fadeUp { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

  @keyframes pop { 0% { transform: scale(.7); opacity: 0; } 60% { transform: scale(1.06); opacity: 1; } 100% { transform: scale(1); } }

  @keyframes shake { 0%,100% { transform: translateX(0); } 20% { transform: translateX(-6px); } 40% { transform: translateX(6px); } 60% { transform: translateX(-4px); } 80% { transform: translateX(4px); } }

<script>
'use strict';
/* =====================================================================
   0. Hilfsfunktionen
   ===================================================================== */
const ri = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
const pick = arr => arr[Math.floor(Math.random() * arr.length)];
const gcdN = (a, b) => { a = Math.abs(a); b = Math.abs(b); while (b) [a, b] = [b, a % b]; return a; };
const lcmN = (a, b) => a / gcdN(a, b) * b;
const shuffle = arr => { const a = [...arr]; for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const bgcd = (a, b) => { if (a < 0n) a = -a; if (b < 0n) b = -b; while (b) [a, b] = [b, a % b]; return a; };
const babs = a => a < 0n ? -a : a;

/* =====================================================================
   1. Polynome (exakt, BigInt) und rationale Funktionen
   ===================================================================== */
const P = {
  key(e) { return Object.keys(e).filter(k => e[k]).sort().map(k => k + e[k]).join(''); },
  addTerm(M, e, c) {
    if (c === 0n) return;
    const k = P.key(e), cur = M.get(k);
    if (cur) { const nc = cur.c + c; if (nc === 0n) M.delete(k); else M.set(k, { c: nc, e: cur.e }); }
    else { const ce = {}; for (const v in e) if (e[v]) ce[v] = e[v]; M.set(k, { c, e: ce }); }
  },
  c(n) { const M = new Map(); P.addTerm(M, {}, BigInt(n)); return M; },
  v(x) { const M = new Map(); P.addTerm(M, { [x]: 1 }, 1n); return M; },
  add(A, B) { const M = new Map(); for (const t of A.values()) P.addTerm(M, t.e, t.c); for (const t of B.values()) P.addTerm(M, t.e, t.c); return M; },
  scale(A, s) { const M = new Map(); for (const t of A.values()) P.addTerm(M, t.e, t.c * s); return M; },
  divConst(A, s) { const M = new Map(); for (const t of A.values()) P.addTerm(M, t.e, t.c / s); return M; },
  neg(A) { return P.scale(A, -1n); },
  sub(A, B) { return P.add(A, P.neg(B)); },
  mul(A, B) {
    const M = new Map();
    for (const a of A.values()) for (const b of B.values()) {
      const e = { ...a.e }; for (const v in b.e) e[v] = (e[v] || 0) + b.e[v];
      P.addTerm(M, e, a.c * b.c);
    }
    return M;
  },
  pow(A, n) { let R = P.c(1); for (let i = 0; i < n; i++) R = P.mul(R, A); return R; },
  isZero(A) { return A.size === 0; },
  eq(A, B) { return P.isZero(P.sub(A, B)); },
  tdeg(t) { let s = 0; for (const v in t.e) s += t.e[v]; return s; },

   8. Aufgabe aufbauen

const DEF_HINTS = {
  kehrwert: ['Geteilt durch einen Bruch = mal seinen Kehrwert. Nur der zweite Bruch wird umgedreht.'],
  factor: ['Checkliste: 1. Gemeinsamen Faktor ausklammern. 2. Binomische Formel? 3. Vier Summanden → gruppieren.'],
  combine: ['Bei der Multiplikation gilt: Zähler mal Zähler, Nenner mal Nenner. Schreib alles auf EINEN Bruchstrich – und lass die Klammern stehen, nichts ausmultiplizieren!',
            'Tipp zur Eingabe: Setz den ganzen Zähler und den ganzen Nenner in Klammern, z. B. (…)(…)/((…)(…)). In der Vorschau siehst du, ob es passt.'],
  hn: ['Schreib jeden Nenner in Faktoren zerlegt hin und sammle jeden Faktor in seiner höchsten Potenz.'],
  final: ['Suche Faktoren, die im Zähler UND im Nenner stehen, und kürze sie.'],
  reduce: ['Schau dir jeden Bruch einzeln an: Lässt er sich kürzen oder aufteilen?'],
};

function autoErrors(t) {
  const out = [], pa = t.promptAst;
  try {
    if (t.kind === 'mul') {
      const ps = fracParts(pa);
      if (ps.length === 2) {
        const v = ps.map(x => x.d ? RF.div(toRF(x.n), toRF(x.d)) : toRF(x.n));
        out.push({ rf: RF.add(v[0], v[1]), tag: 'operation', msg: 'Hoppla – du hast die Brüche <b>addiert</b> statt multipliziert. Bei „·“ gilt: Zähler · Zähler und Nenner · Nenner.' });
      }
    }
    if (t.kind === 'div' && pa.t === 'div' && pa.colon) {
      const A = toRF(pa.a), B = toRF(pa.b);
      out.push({ rf: RF.mul(A, B), tag: 'kehrwert', msg: 'Du hast mit dem Bruch <b>multipliziert statt mit seinem Kehrwert</b>. Bei der Division wird der zweite Bruch umgedreht!' });
      out.push({ rf: RF.mul(RF.inv(A), B), tag: 'kehrwert', msg: 'Du hast den <b>falschen Bruch</b> umgedreht – nur der Bruch hinter dem „:“ wird zum Kehrwert.' });
    }
    if (t.kind === 'add') {
      const ts = signedTerms(pa).map(({ s, node }) => {
        const x = stripNeg(node);
        const n = (x.t === 'div' && !x.colon) ? toRF(x.a) : toRF(x), d = (x.t === 'div' && !x.colon) ? toRF(x.b) : ONE();
        return { n: s < 0 ? RF.neg(n) : n, d, ds: s < 0 ? RF.neg(d) : d };
      });
      if (ts.length >= 2) {
        const sumN = ts.map(x => x.n).reduce(RF.add), sumD = ts.map(x => x.d).reduce(RF.add), sumDs = ts.map(x => x.ds).reduce(RF.add);
        const zz = 'Achtung, Klassiker! Brüche addiert man <b>nicht</b>, indem man Zähler + Zähler und Nenner + Nenner rechnet. Du brauchst einen gemeinsamen Nenner.';
        for (const D of [sumD, sumDs]) if (!P.isZero(D.n)) out.push({ rf: RF.div(sumN, D), tag: 'zaehler-nenner', msg: zz });
        if (t.hnPoly) out.push({ rf: RF.div(sumN, { n: t.hnPoly, d: P.c(1) }), tag: 'erweitern', msg: 'Der Hauptnenner stimmt, aber die <b>Zähler wurden nicht mit erweitert</b>. Was du unten dranmultiplizierst, muss auch oben dran!' });
        const prod = ts.map(x => RF.div(x.n, x.d)).reduce(RF.mul);
        out.push({ rf: prod, tag: 'operation', msg: 'Das ist das Ergebnis einer <b>Mal</b>-Aufgabe. Hier wird aber addiert/subtrahiert – dafür brauchst du einen Hauptnenner.' });
      }
    }
  } catch (e) { /* Automatische Fehlerkandidaten sind optional */ }
  return out;
}

function buildTask(spec, mode) {
  const t = { ...spec, variant: spec.variant || 'std', mode };
  t.promptAst = parse(spec.prompt);
  t.value = toRF(t.promptAst);
  t.finalAst = parse(spec.final);
  t.finalDeg = RF.deg(toRF(t.finalAst));
  if (spec.hn) {
    t.hnPoly = toRF(parse(spec.hn)).n; t.hnRoots = intRoots(t.hnPoly);
    t.prodPoly = signedTerms(t.promptAst).map(({ node }) => { const x = stripNeg(node); return (x.t === 'div' && !x.colon) ? toRF(x.b).n : P.c(1); }).reduce(P.mul, P.c(1));
    if (P.ratio(t.prodPoly, t.hnPoly)) t.prodPoly = null;
  }
  t.known = [];
  for (const s of [spec.kehrwert, spec.factored, spec.combined, spec.final, spec.hn, spec.reduced]) {
    if (!s) continue;
    for (const f of sumFactors(parse(s))) {
      const r = toRF(f.node);
      if (P.isConst(r.d) && P.deg(r.n) >= 1) { const pr = P.primitive(r.n); if (!t.known.some(k => P.eq(k, pr))) t.known.push(pr); }
    }
  }
  t.errs = [...(spec.errors || []).map(er => ({ ...er, rf: toRF(parse(er.e)) })), ...autoErrors(t)]
    .filter(er => { try { return !P.isZero(er.rf.d) && !RF.eq(er.rf, t.value); } catch (e) { return false; } });

  const H = spec.hints || {};
  const hints = (id, fb) => (H[id] && H[id].length ? H[id] : DEF_HINTS[fb || id]);
  const steps = [];
  const expr = (o) => { o.type = 'expr'; if (o.ref) o.refAst = parse(o.ref); o.expAst = parse(o.expected); if (o.check === 'reduceEach' || o.check === 'sameDen') o.cx = complexity(o.expAst); steps.push(o); };
  if (mode === 'steps') {
    const sk = t.variant !== 'std' ? 'trick' : t.kind, S0 = STRAT[sk];
    steps.push({ id: 'strategy', type: 'choice', title: 'Strategie', q: S0.q, opts: shuffle(S0.opts), hints: [S0.hint] });
    if (t.kind === 'mul' || t.kind === 'div') {
      if (t.kind === 'div') expr({ id: 'kehrwert', check: 'kehrwert', title: 'Kehrwert', instr: 'Schreibe die Division als <b>Multiplikation mit dem Kehrwert</b> des zweiten Bruchs.', expected: spec.kehrwert, ref: spec.prompt, hints: hints('kehrwert') });
      expr({ id: 'factor', check: 'factorAll', title: 'Faktorisieren', instr: 'Zerlege <b>jeden Zähler und jeden Nenner</b> in Faktoren (ausklammern, binomische Formeln, gruppieren). Noch nicht kürzen, nichts ausmultiplizieren.', expected: spec.factored, ref: spec.kehrwert || spec.prompt, hints: hints('factor') });
      expr({ id: 'combine', check: 'combineMul', title: 'Ein Bruchstrich', instr: 'Schreibe alles auf <b>einen Bruchstrich</b>: Zähler · Zähler durch Nenner · Nenner. Lass die Faktoren stehen!', expected: spec.combined, hints: hints('combine') });
      expr({ id: 'final', check: 'final', title: 'Kürzen', instr: 'Kürze alle gemeinsamen Faktoren und gib das <b>Endergebnis</b> an.', expected: spec.final, hints: hints('final') });
    } else if (t.variant === 'std') {
      if (!spec.skipFactor) expr({ id: 'factor', check: 'factorDen', title: 'Nenner zerlegen', instr: 'Zerlege <b>alle Nenner</b> in Faktoren. Die Zähler darfst du so lassen.', expected: spec.factored, ref: spec.prompt, hints: hints('factor') });
      expr({ id: 'hn', check: 'hn', title: 'Hauptnenner', instr: 'Gib den <b>Hauptnenner</b> an – das kleinste gemeinsame Vielfache aller Nenner. (Nur den Nenner eingeben, faktorisiert oder ausmultipliziert.)', expected: spec.hn, hints: hints('hn') });
      expr({ id: 'combine', check: 'combineAdd', title: 'Erweitern', instr: 'Erweitere alle Brüche auf den Hauptnenner und schreibe alles auf <b>einen Bruchstrich</b>. Klammern um die Zähler!', expected: spec.combined, hints: hints('combine', 'hn') });
      expr({ id: 'final', check: 'final', title: 'Zusammenfassen', instr: 'Löse die Klammern im Zähler auf, fasse zusammen und kürze, falls möglich. Gib das <b>Endergebnis</b> an.', expected: spec.final, hints: hints('final') });
    } else {
      expr({ id: 'reduce', check: t.variant === 'sameDen' ? 'sameDen' : 'reduceEach', title: 'Vorab vereinfachen', instr: t.variant === 'sameDen' ? 'Bring beide Brüche auf <b>denselben Nenner</b> – ohne ihn größer zu machen.' : 'Vereinfache zuerst <b>jeden Bruch einzeln</b> (kürzen, aufteilen) – bevor du an einen Hauptnenner denkst.', expected: spec.reduced, ref: spec.prompt, hints: hints('reduce') });
      expr({ id: 'final', check: 'final', title: 'Ergebnis', instr: 'Fasse zusammen und gib das <b>Endergebnis</b> an.', expected: spec.final, hints: hints('final') });
    }
  } else {
    const sk = t.variant !== 'std' ? 'trick' : t.kind;
    const dh = [STRAT[sk].hint];
    for (const id of ['kehrwert', 'factor', 'reduce', 'hn', 'combine', 'final']) if (H[id] && H[id][0]) dh.push(H[id][0]);
    expr({ id: 'final', check: 'final', title: 'Ergebnis', instr: 'Vereinfache so weit wie möglich und gib nur das <b>Endergebnis</b> ein.', expected: spec.final, hints: dh });
  }
  t.steps = steps;
  return t;
}

/* =====================================================================
   9. Prüfen & Fehler-Diagnose
   ===================================================================== */
function finalCheck(t, ast, rf) {
  const terms = termsOf(ast);
  const fracTerms = terms.filter(x => !P.isConst(toRF(x).d)).length;
  if (fracTerms > 1 || (fracTerms === 1 && terms.length > 1 && termsOf(t.finalAst).length === 1))
    return { status: 'almost', msg: 'Der Wert stimmt schon – aber fasse noch alles auf <b>einen Bruchstrich</b> zusammen.' };
  const top = stripNeg(ast);
  const numNode = (top.t === 'div' && !top.colon) ? top.a : top;
  const nts = termsLit(numNode);
  if (nts.length > 1 && (nts.some(hasSumInside) || nts.length > toRF(numNode).n.size))
    return { status: 'almost', msg: `Der Wert stimmt – aber ${top === numNode ? 'der Term' : 'der Zähler'} ist noch nicht <b>zusammengefasst</b>. Klammern auflösen und gleiche Glieder zusammenrechnen.` };
  if (RF.deg(rf) > t.finalDeg)
    return { status: 'almost', tag: 'nicht-gekuerzt', msg: `Richtig umgeformt – aber noch <b>nicht fertig gekürzt</b>.${commonFactorHint(rf) || ' Faktorisiere Zähler und Nenner und suche gemeinsame Faktoren.'}` };
  const g = bgcd(P.content(rf.n), P.content(rf.d));
  if (g > 1n && !P.isZero(rf.n))
    return { status: 'almost', tag: 'nicht-gekuerzt', msg: `Fast perfekt! Die Zahlen oben und unten sind beide durch <b>${g}</b> teilbar – kürze noch.` };
  return { status: 'ok' };
}

function checkHN(t, ast, rf) {
  if (!P.isConst(rf.d)) return { status: 'error', msg: 'Der Hauptnenner ist nur ein <b>Nenner</b> – ein Produkt von Faktoren ohne Bruchstrich, z. B. (x − 1)(x + 1).' };
  const U = rf, L = { n: t.hnPoly, d: P.c(1) };
  const r = RF.ratio(U, L);
  if (r) {
    const [n, d] = r;
    if (d === 1n && babs(n) === 1n) return { status: 'ok' };
    if (d === 1n && n !== 0n) return { status: 'almost', tag: 'kgv', msg: `Das ist ein gemeinsamer Nenner, aber nicht der <b>kleinste</b>: Der Zahlenfaktor ist ${babs(n)}-mal zu groß. Nimm bei Zahlen das kgV, nicht das Produkt.` };
    return { status: 'error', msg: 'Da fehlt ein Zahlenfaktor – jeder Nenner muss vollständig im Hauptnenner stecken.' };
  }
  if (t.prodPoly && RF.ratio(U, { n: t.prodPoly, d: P.c(1) }))
    return { status: 'almost', tag: 'kgv', msg: 'Du hast einfach alle Nenner multipliziert. Das ist ein gemeinsamer Nenner, aber nicht der kleinste – gemeinsame Faktoren kommen nur <b>einmal</b> hinein. Zerlege die Nenner und vergleiche!' };
  const vs = P.vars(U.n);
  if (vs.every(v => v === 'x')) {
    for (const root of t.hnRoots) if (P.evalAt(U.n, { x: BigInt(root) }) !== 0n)
      return { status: 'error', msg: `Im Hauptnenner fehlt noch ${linLabel('x', root)}. Jeder Nenner muss komplett darin enthalten sein.` };
  }
  if (P.deg(U.n) > P.deg(t.hnPoly)) return { status: 'almost', tag: 'kgv', msg: 'Dein Nenner ist zu groß – ein Faktor steckt doppelt drin. Jeder Faktor nur so oft, wie er in einem einzelnen Nenner höchstens vorkommt.' };
  if (P.deg(U.n) < P.deg(t.hnPoly)) return { status: 'error', msg: 'Da fehlt noch etwas. Achte auch auf Potenzen: Steht irgendwo z. B. (x + 1)², muss der Faktor zweimal hinein.' };
  return { status: 'error', msg: 'Das passt noch nicht. Schreib alle Nenner in Faktoren zerlegt untereinander und sammle jeden Faktor in seiner höchsten Potenz.' };
}

const GENERIC = {
  kehrwert: 'Das hat nicht mehr denselben Wert wie die Aufgabe. Denk dran: Nur der zweite Bruch wird umgedreht, aus „:“ wird „·“.',
  factorAll: 'Dein Term hat nicht mehr denselben Wert wie vorher. Multipliziere deine Faktoren zur Kontrolle im Kopf wieder aus.',
  factorDen: 'Dein Term hat nicht mehr denselben Wert wie vorher. Multipliziere deine Faktoren zur Kontrolle im Kopf wieder aus.',
  combineMul: 'Beim Zusammenziehen hat sich der Wert geändert. Zähler · Zähler und Nenner · Nenner – nichts weglassen, nichts dazuerfinden.',
  combineAdd: 'Der Wert stimmt nicht mehr. Prüfe beim Erweitern: Wurde jeder Zähler mit genau dem Faktor multipliziert, der seinem Nenner zum Hauptnenner fehlt?',
  reduceEach: 'Der Wert hat sich verändert. Kürzen darfst du nur gemeinsame Faktoren von Zähler und Nenner.',
  sameDen: 'Der Wert hat sich verändert. Wenn du einen Nenner umdrehst, bekommt der Bruch ein Minus.',
  final: 'Das stimmt leider noch nicht. Rechne Schritt für Schritt nach – oder hol dir einen Hinweis.',
};

function diagnose(t, step, ast, rf) {
  for (const er of t.errs) { try { if (RF.eq(rf, er.rf)) return { status: 'error', tag: er.tag, msg: er.msg }; } catch (e) { } }
  try {
    if (step.check === 'factorAll' || step.check === 'factorDen') { const pm_ = partMismatch(step.refAst, ast); if (pm_) return pm_; }
    if (step.check === 'reduceEach' || step.check === 'sameDen') { const tm = termValueMismatch(step.refAst, ast); if (tm) return tm; }
  } catch (e) { }
  const r = RF.ratio(rf, t.value);
  if (r) {
    const [n, d] = r;
    if (n === -1n && d === 1n) return { status: 'error', tag: 'vorzeichen', msg: `Fast! Dein Term ist genau das <b>Negative</b> vom richtigen. Irgendwo ist ein Vorzeichen gekippt – prüfe Minus-Klammern und Terme wie ${Meq('a-x', '-(x-a)')}.` };
    if (n !== 0n) return { status: 'error', tag: 'zahlen', msg: `Die Variablen stimmen – nur ein <b>Zahlenfaktor</b> passt nicht (dein Term ist das ${d === 1n ? n : `${n}/${d}`}-fache vom richtigen). Prüfe das Kürzen der Zahlen.` };
  }
  if (!P.isZero(rf.n)) { try { if (RF.eq(RF.inv(rf), t.value)) return { status: 'error', tag: 'kehrwert', msg: 'Zähler und Nenner sind <b>vertauscht</b> – dein Term ist genau der Kehrwert des richtigen.' }; } catch (e) { } }
  return { status: 'error', msg: GENERIC[step.check] || GENERIC.final };
}

function evaluate(t, step, input) {
  let ast, rf;
  try { ast = parse(input); rf = toRF(ast); } catch (e) { return { status: 'syntax', msg: e.message }; }
  if (P.isZero(rf.d)) return { status: 'syntax', msg: 'Division durch 0.' };
  if (step.check === 'hn') return checkHN(t, ast, rf);
  if (!RF.eq(rf, t.value)) return diagnose(t, step, ast, rf);

  const fin = finalCheck(t, ast, rf);
  if (step.check === 'final') return fin;
  const jump = fin.status === 'ok' ? { status: 'ok', jump: true } : null;

  switch (step.check) {
    case 'kehrwert':
      if (jump) return jump;
      if (hasColon(ast) || hasDivByFraction(ast)) return { status: 'almost', msg: 'Der Wert stimmt, aber du teilst noch <b>durch einen Bruch</b>. Dreh den zweiten Bruch um und mach aus „:“ ein „·“.' };
      return { status: 'ok' };
    case 'factorAll': case 'factorDen': {
      if (jump) return jump;
      const na = findNonAtomic(ast, step.check === 'factorDen' ? 'den' : 'all', t.known);
      if (na) return { status: 'almost', tag: 'nicht-faktorisiert', msg: 'Richtig umgeformt, aber noch nicht fertig zerlegt. ' + nonAtomicMsg(na) };
      if (hasColon(ast)) return { status: 'almost', msg: 'Zerlegt – aber da steht noch ein „:“. Erst den Kehrwert nehmen!' };
      return { status: 'ok' };
    }
    case 'combineMul': {
      if (jump) return jump;
      if (!isSingleFraction(ast)) return { status: 'almost', msg: 'Der Wert stimmt – schreib aber alles auf <b>einen Bruchstrich</b>: (Zähler · Zähler)/(Nenner · Nenner).' };
      const na = findNonAtomic(ast, 'all', t.known);
      if (na) return { status: 'error', tag: 'ausmultipliziert', msg: `Stopp – nicht ausmultiplizieren! Bei ${Mnode(na.node, true)} sieht man die Faktoren nicht mehr. Lass alles als <b>Produkt von Faktoren</b> stehen – nur so siehst du, was sich kürzen lässt.` };
      return { status: 'ok' };
    }
    case 'combineAdd': {
      if (jump) return jump;
      if (!isSingleFraction(ast)) return { status: 'almost', msg: 'Der Wert stimmt – schreib aber alles auf <b>einen Bruchstrich</b> über dem Hauptnenner.' };
      const den = denPoly(ast);
      if (den && !P.ratio(den, t.hnPoly)) {
        if (P.deg(den) > P.deg(t.hnPoly)) return { status: 'almost', tag: 'kgv', msg: 'Der Wert stimmt, aber dein Nenner ist größer als der Hauptnenner. Nimm den Hauptnenner aus dem letzten Schritt – sonst musst du am Ende viel kürzen.' };
        return { status: 'almost', msg: 'Der Wert stimmt – nutze als Nenner aber den <b>Hauptnenner</b> aus dem letzten Schritt.' };
      }
      return { status: 'ok' };
    }
    case 'reduceEach': {
      if (jump) return jump;
      if (complexity(ast) > step.cx) {
        if (termsOf(ast).length === 1 && termsOf(t.promptAst).length > 1)
          return { status: 'error', tag: 'hn-statt-trick', msg: 'Du hast direkt alles auf einen Hauptnenner gebracht. Mathematisch okay – aber ein <b>riesiger Umweg</b>! Schau dir jeden Bruch einzeln an: Lässt er sich vorher kürzen oder aufteilen?' };
        return { status: 'almost', msg: 'Richtig umgeformt, aber mindestens ein Bruch lässt sich noch weiter vereinfachen. Faktorisiere Zähler und Nenner jedes Bruchs einzeln.' };
      }
      return { status: 'ok' };
    }
    case 'sameDen': {
      if (jump) return jump;
      const dens = termsOf(ast).map(x => toRF(x).d).filter(d => !P.isConst(d));
      if (!dens.every(d => P.eq(d, dens[0]))) return { status: 'almost', msg: `Der Wert stimmt, aber die Nenner sind noch verschieden. Tipp: ${Meq('a-x', '-(x-a)')}.` };
      if (complexity(ast) > step.cx) return { status: 'error', tag: 'hn-statt-trick', msg: `Du hast (x − a)(a − x) als Hauptnenner genommen. Geht – ist aber unnötig groß! Die beiden Nenner unterscheiden sich nur im Vorzeichen: ${Meq('a-x', '-(x-a)')}.` };
      return { status: 'ok' };
    }
  }
  return { status: 'ok' };
}

const KEYS = [
  ['7', '8', '9', '(', ')', '⌫'],
  ['4', '5', '6', 'x', 'y', '^'],
  ['1', '2', '3', 'a', 'b', '²'],
  ['0', '+', '−', '·', '/', ':'],
  ['▢/▢', '(▢)²', '←', '→', 'C', '↵'],
];
function renderKeypad() {
  const kp = $('#keypad'); if (!kp) return;
  kp.innerHTML = `<div class="grid grid-cols-6 gap-1.5">${KEYS.flat().map(k => {
    let cls = 'bg-slate-800 text-slate-100 border-slate-700';
    if (/^[xyab]$/.test(k)) cls = 'bg-indigo-500/15 text-indigo-200 border-indigo-400/30 italic font-serif';
    else if ('+−·/:^²()'.includes(k) || k === '▢/▢' || k === '(▢)²') cls = 'bg-slate-700/70 text-slate-100 border-slate-600';
    else if (k === '⌫' || k === 'C' || k === '←' || k === '→') cls = 'bg-slate-900 text-slate-300 border-slate-700';
    else if (k === '↵') cls = 'bg-emerald-500 text-slate-950 border-emerald-400 font-bold';
    return `<button type="button" data-k="${esc(k)}" class="key h-11 rounded-xl border text-lg ${cls}">${k}</button>`;
  }).join('')}</div>`;
  kp.querySelectorAll('.key').forEach(b => {
    b.addEventListener('pointerdown', e => e.preventDefault());
    b.addEventListener('click', () => onKey(b.dataset.k));
  });
}
function onKey(k) {
  const el = $('#inp'); if (!el) return;
  const s = el.selectionStart ?? el.value.length, e = el.selectionEnd ?? el.value.length;
  const put = (txt, caret) => { el.value = el.value.slice(0, s) + txt + el.value.slice(e); const p = s + (caret ?? txt.length); el.setSelectionRange(p, p); };
  switch (k) {
    case '⌫': if (s !== e) put(''); else if (s > 0) { el.value = el.value.slice(0, s - 1) + el.value.slice(e); el.setSelectionRange(s - 1, s - 1); } break;
    case 'C': el.value = ''; break;
    case '←': el.setSelectionRange(Math.max(0, s - 1), Math.max(0, s - 1)); break;
    case '→': el.setSelectionRange(Math.min(el.value.length, e + 1), Math.min(el.value.length, e + 1)); break;
    case '↵': onCheck(); return;
    case '▢/▢': put('()/()', 1); break;
    case '(▢)²': put('()^2', 1); break;
    case '²': put('^2'); break;
    case '−': put('-'); break;
    default: put(k);
  }
  el.focus({ preventScroll: true }); updatePreview();
}

  const res = evaluate(S.task, st, v);
  if (res.status === 'ok') {
    const html = (() => { try { return `<span class="math">${R(parse(v))}</span>`; } catch (e) { return esc(v); } })();
    stepSuccess(st, html, v, res.jump);
    return;
  }
  if (res.status === 'error') {
    S.errors++;
    if (res.tag) { stats.mist[res.tag] = (stats.mist[res.tag] || 0) + 1; saveStats(); }
    inp.classList.remove('shake'); void inp.offsetWidth; inp.classList.add('shake');
  }
  if (res.status === 'almost' && res.tag === 'kgv') { stats.mist.kgv = (stats.mist.kgv || 0) + 1; saveStats(); }
  feedback(res);
}

function onChoice(btn, opt) {
  if (opt.ok) {
    btn.classList.add('border-emerald-400', 'bg-emerald-500/15', 'glow');
    stepSuccess(S.task.steps[S.idx], `<span class="text-slate-200">${opt.l}</span>`, null);
    return;
  }
  S.errors++;
  if (opt.tag) { stats.mist[opt.tag] = (stats.mist[opt.tag] || 0) + 1; saveStats(); }
  btn.disabled = true;
  btn.classList.add('opacity-50', 'line-through', 'border-rose-400/50', 'shake');
  feedback({ status: 'error', tag: opt.tag, msg: opt.msg });
}

function stepSuccess(st, html, input, jump) {
  const gain = S.stepRevealed ? 0 : Math.max(3, 10 - 3 * S.stepHints);
  S.pts += gain;
  S.log.push({ title: st.title, html, revealed: S.stepRevealed });
  if (input !== null && st.check !== 'hn') S.lastExpr = input;
  const anchor = $('#btnCheck') || document.querySelector('.opt.glow') || $('#stepArea');
  if (gain) floatPoints(anchor, `+${gain}`);
  feedback({ status: 'ok', title: jump ? 'Wow – du bist schon am Ziel! 🚀' : (STEP_PRAISE[st.id] || pick(PRAISE)), msg: jump ? 'Du hast gleich mehrere Schritte auf einmal erledigt.' : '' });
  document.querySelectorAll('#stepArea button, #stepArea input').forEach(b => b.disabled = true);
  const next = () => {
    if (jump || S.idx >= S.task.steps.length - 1) return completeTask();
    S.idx++; renderStepper(); renderPath(); renderStep();
  };
  setTimeout(next, jump ? 1100 : 750);
}

function onHint() {
  const st = S.task.steps[S.idx], list = $('#hintList');
  if (S.stepHints < st.hints.length) {
    const h = st.hints[S.stepHints];
    S.stepHints++; S.hints++;
    list.insertAdjacentHTML('beforeend', `<div class="hint-text rounded-2xl border border-amber-400/30 bg-amber-400/5 p-3 text-amber-50/90 leading-relaxed fade-in"><span class="font-bold text-amber-300">💡 Hinweis ${S.stepHints}:</span> ${h}</div>`);
    if (S.stepHints >= st.hints.length) $('#btnHint').innerHTML = st.type === 'choice' ? '👀 Auflösen' : (st.id === 'final' ? '👀 Lösung zeigen' : '👀 Zwischenschritt');
    return;
  }
  reveal(st);
}
function reveal(st) {
  S.stepRevealed = true; S.revealed = true;
  if (st.type === 'choice') {
    const o = st.opts.find(x => x.ok);
    const btn = [...document.querySelectorAll('.opt')].find(b => st.opts[+b.dataset.opt].ok);
    $('#feedback').innerHTML = `<div class="rounded-2xl border border-sky-400/40 bg-sky-500/10 p-3.5 fade-in"><div class="font-bold text-sky-200">👀 Richtige Strategie</div><div class="mt-1 text-sky-50">${o.l}</div>
      <button id="btnTake" class="mt-3 px-4 py-2 rounded-xl bg-sky-500 text-slate-950 font-bold">Verstanden – weiter</button></div>`;
    $('#btnTake').onclick = () => { if (btn) btn.classList.add('border-sky-400'); stepSuccess(st, `<span class="text-slate-200">${o.l}</span>`, null); };
    return;
  }
  const txt = ser(st.expAst);
  $('#feedback').innerHTML = `<div class="rounded-2xl border border-sky-400/40 bg-sky-500/10 p-3.5 fade-in">
    <div class="font-bold text-sky-200">👀 So sieht dieser Schritt aus</div>
    <div class="scroll-x mt-2 py-1"><span class="math text-xl text-white">${R(st.expAst)}</span></div>
    <div class="mt-1 text-xs text-sky-200/70">Schau ihn dir in Ruhe an – beim nächsten Mal schaffst du es allein.</div>
    <button id="btnTake" class="mt-3 px-4 py-2 rounded-xl bg-sky-500 text-slate-950 font-bold">Übernehmen & weiter</button></div>`;
  $('#inp').value = txt; updatePreview();
  $('#btnTake').onclick = () => stepSuccess(st, `<span class="math">${R(st.expAst)}</span>`, txt);
}

function completeTask() {
  S.done = true;
  const t = S.task, perfect = !S.errors && !S.hints && !S.revealed;
  let bonus = 0;
  if (!S.revealed) { stats.streak++; bonus += Math.min(stats.streak, 10); } else stats.streak = 0;
  if (perfect) { bonus += 5; stats.perfect++; }
  S.pts += bonus; S.bonus = bonus;
  stats.points += S.pts; stats.solved++;
  stats.lvl[t.level] = (stats.lvl[t.level] || 0) + 1;
  stats.best = Math.max(stats.best, stats.streak);
  saveStats(); updateHeader(); renderLevels(); renderStepper(); renderPath();
  renderDone();
  if (!S.revealed) confetti(perfect ? 180 : 90);
  if (stats.lvl[t.level] === GOAL) setTimeout(() => toast(`⭐ Level ${t.level} gemeistert! Weiter so!`), 700);
  else if ([3, 5, 10, 15, 20, 30, 50].includes(stats.streak)) setTimeout(() => toast({ 3: '🔥 3er-Serie – du bist im Flow!', 5: '⚡ 5 in Folge – stark!', 10: '🏆 10er-Serie! Bruch-Legende!' }[stats.streak] || `🔥 ${stats.streak}er-Serie!`), 700);
}
function renderDone() {
  const t = S.task, perfect = !S.errors && !S.hints && !S.revealed;
  const emoji = S.revealed ? '💪' : perfect ? '🌟' : '🎉';
  const title = S.revealed ? 'Geschafft – mit etwas Hilfe' : perfect ? 'Perfekt gelöst!' : pick(['Aufgabe gelöst!', 'Stark gemacht!', 'Sauber durchgezogen!']);
  const sub = S.revealed ? 'Schau dir den Lösungsweg oben nochmal an – die nächste packst du allein.' : perfect ? 'Keine Fehler, keine Hinweise. So sieht Können aus.' : 'Fehler gehören dazu – wichtig ist, dass du sie jetzt erkennst.';
  $('#stepArea').innerHTML = `<div class="text-center py-3 pop-in">
    <div class="text-5xl">${emoji}</div>
    <h3 class="mt-2 text-2xl font-extrabold bg-gradient-to-r from-emerald-300 via-cyan-300 to-indigo-300 bg-clip-text text-transparent">${title}</h3>
    <p class="mt-1 text-slate-400 text-sm">${sub}</p>
    <div class="mt-4 flex flex-wrap justify-center gap-2 text-sm">
      <span class="px-3 py-1 rounded-full bg-emerald-500/15 text-emerald-200 border border-emerald-400/30 font-semibold">+${S.pts} Punkte${S.bonus ? ` (inkl. ${S.bonus} Bonus)` : ''}</span>
      <span class="px-3 py-1 rounded-full bg-slate-800 text-slate-300 border border-slate-700">Fehler: ${S.errors}</span>
      <span class="px-3 py-1 rounded-full bg-slate-800 text-slate-300 border border-slate-700">Hinweise: ${S.hints}</span>
      <span class="px-3 py-1 rounded-full bg-orange-500/15 text-orange-200 border border-orange-400/30">🔥 Serie: ${stats.streak}</span>
    </div>
    <div class="mt-4 rounded-2xl bg-slate-950/60 border border-slate-800 p-3">
      <div class="text-[10px] uppercase tracking-widest text-slate-500">Ergebnis</div>
      <div class="scroll-x mt-1"><div class="center-max math text-2xl text-white">${R(t.finalAst)}</div></div>
    </div>
    <div class="mt-2 text-xs text-slate-500">Trainiert: ${t.skill}</div>
    <div class="mt-5 flex flex-wrap gap-2 justify-center">
      <button id="btnNext" class="px-6 py-3 rounded-xl bg-gradient-to-r from-emerald-400 to-cyan-400 text-slate-950 font-extrabold shadow-lg shadow-emerald-900/30 hover:brightness-110">Nächste Aufgabe →</button>
      <button id="btnSame" class="px-4 py-3 rounded-xl bg-slate-800 border border-slate-700 text-slate-200 hover:bg-slate-700">Gleicher Typ nochmal</button>
    </div>
  </div>`;
  $('#btnNext').onclick = newTask;
  $('#btnSame').onclick = () => { const tp = T.find(x => x.id === lastTpl); startTask(tp.gen()); };
  $('#btnNext').focus({ preventScroll: true });
}

/* ---------- Erfolgsmomente ---------- */
function floatPoints(anchor, text) {
  if (!anchor) return;
  const r = anchor.getBoundingClientRect(), el = document.createElement('div');
  el.className = 'float-pts'; el.textContent = text;
  el.style.left = (r.left + r.width / 2) + 'px'; el.style.top = (r.top - 6) + 'px';
  document.body.appendChild(el); setTimeout(() => el.remove(), 1200);
}
let toastTimer = null;
function toast(msg) {
  const el = $('#toast');
  el.innerHTML = `<div class="toast px-4 py-2.5 rounded-2xl bg-slate-800/95 border border-slate-600 shadow-2xl text-sm font-semibold text-slate-100 whitespace-nowrap">${msg}</div>`;
  el.classList.remove('hidden'); el.style.transform = 'translateX(-50%)';
  clearTimeout(toastTimer); toastTimer = setTimeout(() => el.classList.add('hidden'), 2600);
}
function confetti(n) {
  if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const c = $('#confetti'), ctx = c.getContext('2d'), dpr = window.devicePixelRatio || 1;
  c.width = innerWidth * dpr; c.height = innerHeight * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  const cols = ['#818cf8', '#34d399', '#22d3ee', '#fbbf24', '#f472b6', '#a78bfa'];
  const ps = Array.from({ length: n }, () => ({
    x: innerWidth / 2 + (Math.random() - .5) * 120, y: innerHeight * .38,
    vx: (Math.random() - .5) * 13, vy: -Math.random() * 13 - 4, g: .32 + Math.random() * .12,
    s: 4 + Math.random() * 6, r: Math.random() * 6, vr: (Math.random() - .5) * .35, c: pick(cols), shape: Math.random() < .5,
  }));
  const t0 = performance.now();
  (function frame(t) {
    const el = t - t0; ctx.clearRect(0, 0, innerWidth, innerHeight);
    for (const p of ps) {
      p.vy += p.g; p.vx *= .99; p.x += p.vx; p.y += p.vy; p.r += p.vr;
      ctx.save(); ctx.globalAlpha = Math.max(0, 1 - el / 1900); ctx.translate(p.x, p.y); ctx.rotate(p.r); ctx.fillStyle = p.c;
      if (p.shape) ctx.fillRect(-p.s / 2, -p.s / 4, p.s, p.s / 2); else { ctx.beginPath(); ctx.arc(0, 0, p.s / 2.4, 0, 7); ctx.fill(); }
      ctx.restore();
    }
    if (el < 1900) requestAnimationFrame(frame); else ctx.clearRect(0, 0, innerWidth, innerHeight);
  })(t0);
}

/* ---------- Modals ---------- */
function openModal(title, html) {
  $('#modalTitle').innerHTML = title; $('#modalBody').innerHTML = html;
  $('#modal').classList.remove('hidden'); document.body.style.overflow = 'hidden';
}
function closeModal() { $('#modal').classList.add('hidden'); document.body.style.overflow = ''; }

function cheatSheet() {
  const C = {
    indigo: ['border-indigo-400/25 bg-indigo-500/5', 'text-indigo-200'],
    amber: ['border-amber-400/25 bg-amber-500/5', 'text-amber-200'],
    emerald: ['border-emerald-400/25 bg-emerald-500/5', 'text-emerald-200'],
    violet: ['border-violet-400/25 bg-violet-500/5', 'text-violet-200'],
    cyan: ['border-cyan-400/25 bg-cyan-500/5', 'text-cyan-200'],
    rose: ['border-rose-400/25 bg-rose-500/5', 'text-rose-200'],
    slate: ['border-slate-400/25 bg-slate-500/5', 'text-slate-200'],
  };
  const box = (title, body, color = 'indigo') => `<div class="rounded-2xl border ${C[color][0]} p-4"><div class="font-bold ${C[color][1]} mb-2">${title}</div><div class="text-slate-300 space-y-2 leading-relaxed">${body}</div></div>`;
  openModal('📘 Spickzettel', `<div class="grid gap-3">
    ${box('🥇 Die goldene Regel', `<b>„Aus Summen kürzen nur die Dummen.“</b> Kürzen darfst du nur <b>Faktoren</b>. Also: erst faktorisieren, dann kürzen.<div class="scroll-x">${M('(x+2)/(x+5)')} &nbsp;≠&nbsp; ${M('2/5')} &nbsp;&nbsp;aber&nbsp;&nbsp; ${Meq('(x+2)(x-1)/(x+2)', 'x-1')}</div>`, 'amber')}
    ${box('✖️ Mal & ➗ Geteilt – KEIN Hauptnenner', `<div class="scroll-x">${Meq('a/b·c/d', '(a·c)/(b·d)')}</div><div>Vorher über Kreuz kürzen, was geht.</div><div class="scroll-x">${Meq('a/b:c/d', 'a/b·d/c')} &nbsp;(nur den <b>zweiten</b> Bruch umdrehen)</div>`)}
    ${box('➕ Plus & Minus – Hauptnenner', `<ol class="list-decimal list-inside space-y-1"><li>Nenner faktorisieren</li><li>Hauptnenner = jeder Faktor in seiner höchsten Potenz (kgV)</li><li>Jeden Bruch erweitern – <b>Zähler mitnehmen!</b></li><li>Zähler zusammenfassen – Minus-Klammern beachten</li><li>Am Ende nochmal kürzen</li></ol>`, 'emerald')}
    ${box('🧩 Binomische Formeln', `<div class="scroll-x">${Meq('(a+b)^2', 'a^2+2ab+b^2')}</div><div class="scroll-x">${Meq('(a-b)^2', 'a^2-2ab+b^2')}</div><div class="scroll-x">${Meq('(a+b)(a-b)', 'a^2-b^2')} &nbsp;← kein Mittelglied!</div>`, 'violet')}
    ${box('🔧 Faktorisier-Checkliste', `<div>1. <b>Ausklammern</b>: ${Meq('3x+6', '3(x+2)')}, &nbsp;${Meq('x^2+5x', 'x(x+5)')}</div><div>2. <b>Binomische Formel</b> erkennen (Quadratzahlen!)</div><div class="scroll-x">3. <b>Gruppieren</b> bei 4 Summanden: ${Meq('x^3+2x^2-x-2', 'x^2(x+2)-(x+2)', '(x+2)(x^2-1)')}</div><div>4. Nochmal prüfen: Lässt sich ein Faktor weiter zerlegen? (${M('x^4-1')} geht zweimal!)</div>`, 'cyan')}
    ${box('🕵️ Tricks', `<div><b>Vorzeichen drehen:</b> ${Meq('a-x', '-(x-a)')}, z. B. ${Meq('3-x', '-(x-3)')}</div><div class="scroll-x"><b>Bruch aufteilen:</b> ${Meq('(a+b)/c', 'a/c+b/c')} &nbsp;(aber ${M('c/(a+b)')} ≠ ${M('c/a+c/b')}!)</div><div><b>Erst kürzen, dann Hauptnenner:</b> Oft verschwindet der Bruch ganz.</div><div><b>Minus vor dem Bruch:</b> gilt für den ganzen Zähler – Klammer setzen!</div>`, 'rose')}
    ${box('⌨️ Eingabe', `<div><code>x^2</code> Potenz · <code>/</code> Bruch · <code>·</code> oder <code>*</code> mal (darf fehlen) · <code>:</code> geteilt</div><div>Mehrgliedrige Zähler/Nenner in Klammern: <code>(x+1)/(x-1)</code></div>`, 'slate')}
  </div>`);
}
function statsView() {
  const total = Object.values(stats.lvl).reduce((a, b) => a + b, 0);
  const mist = Object.entries(stats.mist).filter(([k, v]) => v > 0 && TAGS[k]).sort((a, b) => b[1] - a[1]);
  const max = mist.length ? mist[0][1] : 1;
  const tile = (v, l) => `<div class="rounded-2xl bg-slate-800/60 border border-slate-700 p-3 text-center"><div class="text-2xl font-extrabold text-slate-100 tabular-nums">${v}</div><div class="text-[11px] text-slate-400">${l}</div></div>`;
  openModal('📊 Statistik & Fehler-Analyse', `
    <div class="grid grid-cols-2 sm:grid-cols-4 gap-2">${tile(total, 'gelöst')}${tile(stats.points, 'Punkte')}${tile(stats.best, 'beste Serie')}${tile(stats.perfect, 'perfekt gelöst')}</div>
    <h3 class="mt-5 mb-2 font-bold text-slate-200">Fortschritt pro Level</h3>
    <div class="space-y-2">${[1, 2, 3, 4].map(l => `<div class="flex items-center gap-3 text-sm"><span class="w-36 shrink-0 text-slate-300">${LEVELS[l].icon} ${LEVELS[l].name}</span>
      <div class="flex-1 h-2 rounded-full bg-slate-800 overflow-hidden"><div class="h-full rounded-full bg-gradient-to-r from-indigo-400 to-emerald-400" style="width:${Math.min(100, stats.lvl[l] / GOAL * 100)}%"></div></div>
      <span class="w-14 text-right tabular-nums text-slate-400">${stats.lvl[l]}${stats.lvl[l] >= GOAL ? ' ⭐' : ''}</span></div>`).join('')}</div>
    <h3 class="mt-5 mb-1 font-bold text-slate-200">Deine typischen Denkfehler</h3>
    <p class="text-xs text-slate-500 mb-3">Die App merkt sich, welche Fehler du machst – und wo du gezielt üben solltest.</p>
    ${mist.length ? `<div class="space-y-2">${mist.map(([k, v]) => `<div class="rounded-2xl border border-slate-700 bg-slate-800/40 p-3">
        <div class="flex items-center gap-2"><span class="font-semibold text-slate-100">${TAGS[k].label}</span><span class="ml-auto text-xs tabular-nums text-rose-300 font-bold">${v}×</span>
        <button data-go="${TAGS[k].lvl}" class="go-lvl text-xs px-2.5 py-1 rounded-lg bg-indigo-500/20 text-indigo-200 border border-indigo-400/30 hover:bg-indigo-500/30">Üben →</button></div>
        <div class="mt-1.5 h-1.5 rounded-full bg-slate-900 overflow-hidden"><div class="h-full bg-rose-400/70" style="width:${v / max * 100}%"></div></div>
        <div class="mt-1.5 text-sm text-slate-400">${TAGS[k].tip}</div></div>`).join('')}</div>`
      : `<div class="rounded-2xl border border-dashed border-slate-700 p-4 text-sm text-slate-400 text-center">Noch keine Fehler erfasst. Leg los – und trau dich, Fehler zu machen! 🙂</div>`}
    <div class="mt-6 text-right"><button id="btnReset" class="text-xs text-slate-500 hover:text-rose-300">Statistik zurücksetzen</button></div>`);
  document.querySelectorAll('.go-lvl').forEach(b => b.onclick = () => { stats.level = +b.dataset.go; saveStats(); closeModal(); renderLevels(); newTask(); });
  $('#btnReset').onclick = () => { if (confirm('Wirklich alle Punkte, Serien und Fehler-Statistiken löschen?')) { const keep = { level: stats.level, mode: stats.mode, keypad: stats.keypad }; stats = { ...defaultStats(), ...keep }; saveStats(); updateHeader(); renderLevels(); statsView(); } };
}

function init() {
  updateHeader(); renderLevels(); renderModes();
  $('#btnNew').onclick = newTask;
  $('#btnCheat').onclick = cheatSheet;
  $('#btnStats').onclick = statsView;
  $('#modalClose').onclick = closeModal;
  $('#modalBg').onclick = closeModal;
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') closeModal();
    if (e.key === 'Enter' && S && S.done && $('#modal').classList.contains('hidden') && !(document.activeElement && document.activeElement.tagName === 'BUTTON')) { e.preventDefault(); newTask(); }
  });
  newTask();
}
if (typeof window !== 'undefined' && typeof document !== 'undefined' && document.getElementById('app')) init();
</script>
</body>
